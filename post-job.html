<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job - HandyMan Cameroon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="jobs.html">Jobs</a><a href="dashboard.html">My Profile</a></nav>
<div class="container" style="max-width:600px;background:white;padding:24px;border-radius:12px;margin:20px auto;">
<h2>Post a Job - All Cameroon Towns</h2>
<input type="text" id="title" placeholder="Job Title e.g. Need Plumber" style="width:100%;padding:10px;margin:8px 0;">
<select id="category" style="width:100%;padding:10px;margin:8px 0;"></select>
<select id="town" style="width:100%;padding:10px;margin:8px 0;"></select>
<input type="text" id="budget" placeholder="Budget e.g. 5000 FCFA" style="width:100%;padding:10px;margin:8px 0;">
<textarea id="description" placeholder="Job description..." style="width:100%;padding:10px;margin:8px 0;height:100px;"></textarea>
<input type="tel" id="phone" placeholder="Your Phone" style="width:100%;padding:10px;margin:8px 0;">
<button onclick="postJob()" class="btn uniform-btn" style="width:100%;">Post Job</button>
<p id="status"></p>
</div>
<script>
window.addEventListener('load', ()=>{
  const tSel=document.getElementById('town'); CAMEROON_TOWNS.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; tSel.appendChild(o); });
  const cSel=document.getElementById('category'); CATEGORIES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cSel.appendChild(o); });
});
async function postJob(){
  const {data:{user}} = await supabaseClient.auth.getUser(); if(!user){ alert('Login first'); location.href='login.html'; return; }
  const job={ title:document.getElementById('title').value, category:document.getElementById('category').value, town:document.getElementById('town').value, budget:document.getElementById('budget').value, description:document.getElementById('description').value, phone:document.getElementById('phone').value, user_id:user.id, status:'open' };
  const {error}=await supabaseClient.from('jobs').insert(job);
  if(error){ document.getElementById('status').innerText='Error: '+error.message; } else { document.getElementById('status').innerText='Job posted!'; setTimeout(()=> location.href='jobs.html',1000); }
}
</script>
<script src="app.js"></script>
</body>
</html>
