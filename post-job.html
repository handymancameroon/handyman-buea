<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Handy Man Cameroon</title>
    <meta name="description" content="Post a free job on Handy Man Cameroon. Find plumbers, electricians, nannies, cleaners and more in Buea, Douala, Yaoundé and across Cameroon.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://handyman-buea.vercel.app/post-job.html">
    <link rel="stylesheet" href="style.css">
    <style>
        .custom-town-field, .custom-category-field { display: none; margin-top: 8px; }
        .custom-town-field.active, .custom-category-field.active { display: block; }
        .upload-hint { color: var(--text-light); font-size: 0.8rem; margin-top: 6px; display: block; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="login.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box" id="postJobBox">
                <h2 data-i18n="post_title">Post a Job</h2>
                <p data-i18n="post_sub">Describe what you need and skilled workers will contact you.</p>
                
                <form id="jobForm" onsubmit="handlePostJob(event)">
                    <div class="form-group">
                        <label data-i18n="job_title_label">Job Title *</label>
                        <input type="text" id="jTitle" required data-i18n-placeholder="job_title_placeholder" placeholder="e.g. Fix leaking kitchen pipe">
                    </div>
                    <div class="form-group">
                        <label data-i18n="job_category_label">Service Category *</label>
                        <select id="jCategory" required onchange="handleJobCategoryChange()">
                            <option value="" data-i18n="select_skill">Select category</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Carpentry">Carpentry</option>
                            <option value="Cleaning">Cleaning</option>
                            <option value="Painting">Painting</option>
                            <option value="Masonry">Masonry</option>
                            <option value="Auto Mechanics">Auto Mechanics</option>
                            <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                            <option value="Hairdressing">Hairdressing</option>
                            <option value="Catering">Catering</option>
                            <option value="Nanny">Nanny</option>
                            <option value="House help">House help</option>
                            <option value="General Labour">General Labour</option>
                            <option value="Laundry services">Laundry services</option>
                            <option value="Transporter">Transporter</option>
                            <option value="Errands">Errands</option>
                            <option value="Construction Engineer">Construction Engineer</option>
                            <option value="Teacher/Tutors">Teacher/Tutors</option>
                            <option value="Lawyer">Lawyer</option>
                            <option value="Family Doctors">Family Doctors</option>
                            <option value="Stay at Home Nurse">Stay at Home Nurse</option>
                            <option value="Security Guard">Security Guard</option>
                            <option value="Gardener">Gardener</option>
                            <option value="Others">Others (specify below)</option>
                        </select>
                        <div id="jCustomCategoryField" class="custom-category-field">
                            <input type="text" id="jCustomCategory" placeholder="Enter the category you need (max 5 words)" maxlength="60">
                            <small class="upload-hint">Maximum 5 words. Extra words will be removed.</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="job_description_label">Description *</label>
                        <textarea id="jDescription" required rows="4" data-i18n-placeholder="job_desc_placeholder" placeholder="Describe the job in detail..."></textarea>
                    </div>

                    <div class="form-group">
                        <label data-i18n="town_label">Town / City *</label>
                        <select id="jTown" required onchange="handleJobTownChange()">
                            <option value="" data-i18n="select_town">Select town</option>
                            <option value="Buea">Buea</option>
                            <option value="Limbe">Limbe</option>
                            <option value="Douala">Douala</option>
                            <option value="Yaoundé">Yaoundé</option>
                            <option value="Bamenda">Bamenda</option>
                            <option value="Kumba">Kumba</option>
                            <option value="Kribi">Kribi</option>
                            <option value="Bafoussam">Bafoussam</option>
                            <option value="Garoua">Garoua</option>
                            <option value="Maroua">Maroua</option>
                            <option value="Ngaoundéré">Ngaoundéré</option>
                            <option value="Bertoua">Bertoua</option>
                            <option value="Ebolowa">Ebolowa</option>
                            <option value="Mutengene">Mutengene</option>
                            <option value="Tiko">Tiko</option>
                            <option value="Other">Other (specify below)</option>
                        </select>
                        <div id="jCustomTownField" class="custom-town-field">
                            <input type="text" id="jCustomTown" placeholder="Enter your town">
                        </div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="job_location_label">More precise location (optional)</label>
                        <input type="text" id="jLocationDetail" data-i18n-placeholder="job_location_placeholder" placeholder="e.g. Molyko, opposite Total">
                        <small class="upload-hint">Quarter or landmark (optional).</small>
                    </div>

                    <div class="form-group">
                        <label data-i18n="job_budget_label">Budget (optional)</label>
                        <input type="text" id="jBudget" data-i18n-placeholder="job_budget_placeholder" placeholder="e.g. 10,000 FCFA or Negotiable">
                    </div>
                    <button type="submit" class="btn-primary full" data-i18n="post_job_btn">Post Job</button>
                </form>
                
                <p id="jobMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            applyLanguage();
            
            if (!currentUser) {
                document.getElementById('postJobBox').innerHTML = `
                    <h2>Login Required</h2>
                    <p>You need to be logged in to post a job.</p>
                    <a href="login.html" class="btn-primary full" style="margin-top: 20px; display: inline-block;">${t('nav_login')}</a>
                `;
            }

            // Limit custom category to 5 words while typing
            var customCat = document.getElementById('jCustomCategory');
            if (customCat) {
                customCat.addEventListener('input', function () {
                    var words = this.value.trim().split(/\s+/).filter(Boolean);
                    if (words.length > 5) {
                        this.value = words.slice(0, 5).join(' ');
                    }
                });
            }
        });

        function handleJobTownChange() {
            const town = document.getElementById('jTown').value;
            const field = document.getElementById('jCustomTownField');
            const input = document.getElementById('jCustomTown');
            if (town === 'Other') {
                field.classList.add('active');
                input.required = true;
            } else {
                field.classList.remove('active');
                input.required = false;
            }
        }

        function handleJobCategoryChange() {
            const cat = document.getElementById('jCategory').value;
            const field = document.getElementById('jCustomCategoryField');
            const input = document.getElementById('jCustomCategory');
            if (cat === 'Others') {
                field.classList.add('active');
                input.required = true;
            } else {
                field.classList.remove('active');
                input.required = false;
            }
        }

        function getJobTown() {
            const town = document.getElementById('jTown').value;
            if (town === 'Other') {
                return document.getElementById('jCustomTown').value.trim() || 'Cameroon';
            }
            return town || 'Cameroon';
        }

        // Limit custom "Others" category to maximum 5 words
        function limitToFiveWords(text) {
            if (!text) return '';
            var words = text.trim().split(/\s+/).filter(Boolean);
            return words.slice(0, 5).join(' ');
        }

        function getJobCategory() {
            const cat = document.getElementById('jCategory').value;
            if (cat === 'Others') {
                var custom = limitToFiveWords(document.getElementById('jCustomCategory').value);
                return custom || 'Others';
            }
            return cat;
        }
        
        async function handlePostJob(e) {
            e.preventDefault();
            
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                showJobMessage('Please login first.', 'error');
                return;
            }

            let fullLocation = getJobTown();
            const detail = document.getElementById('jLocationDetail').value.trim();
            if (detail) {
                fullLocation = detail + ', ' + fullLocation;
            }
            
            const jobData = {
                client_id: user.id,
                title: document.getElementById('jTitle').value.trim(),
                category: getJobCategory(),
                description: document.getElementById('jDescription').value.trim(),
                location: fullLocation,
                budget: document.getElementById('jBudget').value.trim() || 'Negotiable',
                status: 'Open'
            };
            
            const { data: insertedJob, error } = await supabaseClient
                .from('job_posts')
                .insert([jobData])
                .select()
                .single();
            
            if (error) {
                showJobMessage('Error: ' + error.message, 'error');
                return;
            }
            
            try {
                const { data: workersInCategory } = await supabaseClient
                    .from('worker_details')
                    .select('id')
                    .eq('category', jobData.category)
                    .eq('availability', 'Available');
                
                if (workersInCategory && workersInCategory.length > 0) {
                    const notifications = workersInCategory.map(w => ({
                        user_id: w.id,
                        title: 'New Job Available',
                        message: `New ${jobData.category} job posted: "${jobData.title}" in ${jobData.location}`,
                        job_id: insertedJob.id,
                        read: false
                    }));
                    
                    await supabaseClient.from('notifications').insert(notifications);
                }
            } catch (notifyErr) {
                console.log('Notification creation skipped:', notifyErr.message);
            }
            
            showJobMessage('Job posted successfully! Workers have been notified. Redirecting...', 'success');
            setTimeout(() => window.location.href = 'jobs.html', 1500);
        }
        
        function showJobMessage(msg, type) {
            const el = document.getElementById('jobMessage');
            el.textContent = msg;
            el.className = 'message ' + type;
        }
    </script>
</body>
</html>
