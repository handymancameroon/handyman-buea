<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report Worker - HandyMan</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><nav class="navbar"><a href="index.html">🔧 HandyMan</a></nav>
<div class="container" style="max-width:500px;background:white;padding:20px;border-radius:12px;margin:20px auto;">
<h2>Report / Dispute</h2>
<select id="reportedId" style="width:100%;padding:10px;margin:8px 0;"></select>
<textarea id="reason" placeholder="Reason for report..." style="width:100%;padding:10px;margin:8px 0;"></textarea>
<button onclick="submitReport()" class="btn uniform-btn">Submit Report</button><p id="status"></p>
</div>
<script>
async function loadWorkersForReport(){ const {data:workers}=await supabaseClient.from('profiles').select('id,full_name').order('full_name',{ascending:true}); const sel=document.getElementById('reportedId'); sel.innerHTML=workers.map(w=>`<option value="${w.id}">${w.full_name}</option>`).join(''); }
async function submitReport(){ const {data:{user}}=await supabaseClient.auth.getUser(); if(!user){ location.href='login.html'; return; } const {error}=await supabaseClient.from('reports').insert({reporter_id:user.id, reported_id:document.getElementById('reportedId').value, reason:document.getElementById('reason').value, status:'pending'}); if(error) document.getElementById('status').innerText=error.message; else document.getElementById('status').innerText='Report sent - admin will contact both via call/WhatsApp/message'; }
loadWorkersForReport();
</script><script src="app.js"></script></body></html>
