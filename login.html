<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HandyMan Cameroon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="join.html">Join</a></nav>

<div class="container" style="max-width:400px;background:white;padding:24px;border-radius:12px;margin:40px auto;">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email" style="width:100%;padding:10px;margin:10px 0;" required>
<div style="position:relative;">
<input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;" required>
<button type="button" onclick="togglePassword('password')" style="position:absolute;right:8px;top:18px;">👁️ Show</button>
</div>
<button onclick="login()" class="btn uniform-btn" style="width:100%;">Login</button>
<p id="status" style="margin-top:12px;"></p>
<p>New worker? <a href="join.html">Join as Worker</a></p>
<p><a href="#" onclick="resetPassword()">Forgot password?</a></p>
</div>

<script>
function togglePassword(id){ const i=document.getElementById(id); i.type=i.type==='password'?'text':'password'; }
async function login(){
  const email=document.getElementById('email').value; const password=document.getElementById('password').value;
  document.getElementById('status').innerText='Logging in...';
  const {data, error} = await supabaseClient.auth.signInWithPassword({email:email, password:password});
  if(error){ document.getElementById('status').innerText='Error: '+error.message; return; }
  // Check if admin
  const {data:profile} = await supabaseClient.from('profiles').select('is_admin').eq('id', data.user.id).single();
  if(profile && profile.is_admin){ location.href='admin.html'; } else { location.href='dashboard.html'; }
}
async function resetPassword(){
  const email=document.getElementById('email').value; if(!email){ alert('Enter email first'); return; }
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email); if(error) alert(error.message); else alert('Password reset email sent');
}
</script>
<script src="app.js"></script>
</body>
</html>
