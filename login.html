<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .worker-fields, .client-fields {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .worker-fields.active, .client-fields.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Login</button>
                    <button class="tab-btn" onclick="showTab('register')">Register</button>
                </div>
                
                <div id="loginTab" class="tab-content active">
                    <h2>Welcome Back</h2>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn-primary full">Login</button>
                    </form>
                </div>
                
                <div id="registerTab" class="tab-content">
                    <h2>Create Account</h2>
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="regName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="regEmail" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Phone Number (WhatsApp recommended) *</label>
                            <input type="tel" id="regPhone" required placeholder="6XX XXX XXX">
                            <small style="color: var(--text-light);">This number will be used for calls and WhatsApp contact.</small>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
                        </div>
                        <div class="form-group">
                            <label>I am a: *</label>
                            <select id="regType" onchange="toggleFields()">
                                <option value="client">Looking for services (Client)</option>
                                <option value="worker">Offering services (Worker)</option>
                            </select>
                        </div>
                        
                        <!-- Service Category - shown for BOTH client and worker -->
                        <div class="form-group">
                            <label>Service Category *</label>
                            <select id="serviceCategory" required>
                                <option value="">Select category</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Carpentry">Carpentry</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Painting">Painting</option>
                                <option value="Masonry">Masonry</option>
                                <option value="Auto Mechanics">Auto Mechanics</option>
                                <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                                <option value="Hairdressing">Hairdressing</option>
                                <option value="Catering">Catering</option>
                            </select>
                        </div>
                        
                        <!-- Worker-only fields -->
                        <div id="workerFields" class="worker-fields">
                            <div class="form-group">
                                <label>Description of Services *</label>
                                <textarea id="wDescription" required rows="3" placeholder="Describe what you do, your skills, and experience..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Years of Experience</label>
                                <input type="number" id="wExperience" min="0" value="0">
                            </div>
                            <div class="form-group">
                                <label>Profile Photo URL (optional)</label>
                                <input type="url" id="wPhoto" placeholder="https://example.com/your-photo.jpg">
                                <small style="color: var(--text-light);">Paste a link to your photo. Leave blank for default.</small>
                            </div>
                        </div>
                        
                        <!-- Client-only fields -->
                        <div id="clientFields" class="client-fields">
                            <div class="form-group">
                                <label>Job Title *</label>
                                <input type="text" id="cJobTitle" required placeholder="e.g. Fix leaking kitchen pipe">
                            </div>
                            <div class="form-group">
                                <label>Job Description *</label>
                                <textarea id="cJobDesc" required rows="3" placeholder="Describe what you need done..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Location *</label>
                                <input type="text" id="cLocation" required placeholder="e.g. Molyko, Buea" value="Buea">
                            </div>
                            <div class="form-group">
                                <label>Budget (optional)</label>
                                <input type="text" id="cBudget" placeholder="e.g. 10,000 FCFA or Negotiable">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary full">Create Account</button>
                    </form>
                </div>
                
                <p id="authMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        // Initialize fields on page load
        document.addEventListener('DOMContentLoaded', function() {
            toggleFields();
        });
        
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        function toggleFields() {
            const type = document.getElementById('regType').value;
            const workerFields = document.getElementById('workerFields');
            const clientFields = document.getElementById('clientFields');
            
            if (type === 'worker') {
                workerFields.classList.add('active');
                clientFields.classList.remove('active');
                document.querySelectorAll('#workerFields input, #workerFields select, #workerFields textarea').forEach(el => {
                    if (el.id !== 'wPhoto') el.required = true;
                });
                document.querySelectorAll('#clientFields input, #clientFields select, #clientFields textarea').forEach(el => {
                    el.required = false;
                });
            } else {
                workerFields.classList.remove('active');
                clientFields.classList.add('active');
                document.querySelectorAll('#workerFields input, #workerFields select, #workerFields textarea').forEach(el => {
                    el.required = false;
                });
                document.querySelectorAll('#clientFields input, #clientFields select, #clientFields textarea').forEach(el => {
                    el.required = true;
                });
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const fullName = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const isWorker = document.getElementById('regType').value === 'worker';
            const category = document.getElementById('serviceCategory').value;
            const photoUrl = document.getElementById('wPhoto')?.value || null;
            
            // Step 1: Create auth account
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullName,
                        phone: phone,
                        is_worker: isWorker
                    }
                }
            });
            
            if (error) {
                showMessage(error.message, 'error');
                return;
            }
            
            const userId = data.user.id;
            
            // Step 2: Create profile
            const { error: profileError } = await supabaseClient
                .from('profiles')
                .upsert([{
                    id: userId,
                    full_name: fullName,
                    phone: phone,
                    is_worker: isWorker,
                    location: 'Buea',
                    avatar_url: photoUrl
                }], { onConflict: 'id' });
            
            if (profileError) {
                showMessage('Account created but profile error: ' + profileError.message, 'warning');
                return;
            }
            
            // Step 3: Create worker profile OR job post
            if (isWorker) {
                const workerDetails = {
                    id: userId,
                    category: category,
                    description: document.getElementById('wDescription').value,
                    experience_years: parseInt(document.getElementById('wExperience').value) || 0,
                    contact_phone: phone,
                    whatsapp_number: phone,
                    availability: 'Available'
                };
                
                const { error: workerError } = await supabaseClient
                    .from('worker_details')
                    .insert([workerDetails]);
                
                if (workerError) {
                    showMessage('Account created but worker profile error: ' + workerError.message, 'warning');
                    return;
                }
            } else {
                // CLIENT: Auto-create job post
                const jobData = {
                    client_id: userId,
                    title: document.getElementById('cJobTitle').value,
                    description: document.getElementById('cJobDesc').value,
                    category: category,
                    location: document.getElementById('cLocation').value || 'Buea',
                    budget: document.getElementById('cBudget').value || 'Not specified',
                    status: 'Open'
                };
                
                const { error: jobError } = await supabaseClient
                    .from('job_posts')
                    .insert([jobData]);
                
                if (jobError) {
                    showMessage('Account created but job post error: ' + jobError.message, 'warning');
                    return;
                }
            }
            
            showMessage('Account created successfully! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        }
        
        function showMessage(msg, type) {
            const el = document.getElementById('authMessage');
            el.textContent = msg;
            el.className = 'message ' + type;
        }
    </script>
</body>
</html>
