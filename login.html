<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .worker-fields, .client-fields {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .worker-fields.active, .client-fields.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Login</button>
                    <button class="tab-btn" onclick="showTab('register')">Register</button>
                </div>
                
                <div id="loginTab" class="tab-content active">
                    <h2>Welcome Back</h2>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn-primary full">Login</button>
                    </form>
                </div>
                
                <div id="registerTab" class="tab-content">
                    <h2>Create Account</h2>
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="regName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="regEmail" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Phone Number (WhatsApp) *</label>
                            <input type="tel" id="regPhone" required placeholder="6XX XXX XXX">
                            <small style="color: var(--text-light);">Used for calls and WhatsApp contact.</small>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="regPassword" required placeholder="Min 6 characters" minlength="6">
                        </div>
                        <div class="form-group">
                            <label>I am a: *</label>
                            <select id="regType" onchange="toggleFields()">
                                <option value="client">Looking for services (Client)</option>
                                <option value="worker">Offering services (Worker)</option>
                            </select>
                        </div>
                        
                        <!-- Profile Photo Upload -->
                        <div class="form-group">
                            <label>Profile Photo</label>
                            <div class="file-upload-group">
                                <input type="file" id="regPhotoFile" accept="image/jpeg,image/jpg,image/png">
                                <small style="color: var(--text-light); display: block; margin-top: 4px;">Or paste image URL below:</small>
                                <input type="url" id="regPhotoUrl" placeholder="https://example.com/photo.jpg" style="margin-top: 6px;">
                            </div>
                        </div>
                        
                        <!-- Service Category -->
                        <div class="form-group">
                            <label>Service Category *</label>
                            <select id="serviceCategory" required onchange="handleCategoryChange()">
                                <option value="">Select category</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Carpentry">Carpentry</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Painting">Painting</option>
                                <option value="Masonry">Masonry</option>
                                <option value="Auto Mechanics">Auto Mechanics</option>
                                <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                                <option value="Hairdressing">Hairdressing</option>
                                <option value="Catering">Catering</option>
                                <option value="Others">Others (specify below)</option>
                            </select>
                            <div id="customCategoryField" class="custom-category-field">
                                <input type="text" id="customCategory" placeholder="Enter your skill or category">
                            </div>
                        </div>
                        
                        <!-- Worker-only fields -->
                        <div id="workerFields" class="worker-fields">
                            <div class="form-group">
                                <label>Description of Services *</label>
                                <textarea id="wDescription" required rows="3" placeholder="Describe what you do..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Years of Experience</label>
                                <input type="number" id="wExperience" min="0" value="0">
                            </div>
                            <!-- Worker Portfolio -->
                            <div class="form-group">
                                <label>Portfolio Photos (optional, max 2)</label>
                                <div class="file-upload-group">
                                    <input type="file" id="wPortfolio" accept="image/jpeg,image/jpg,image/png,application/pdf" multiple>
                                    <small style="color: var(--text-light);">Show photos of your past work (JPEG, PNG, or PDF)</small>
                                </div>
                                <div class="file-preview" id="wPortfolioPreview"></div>
                            </div>
                        </div>
                        
                        <!-- Client-only fields -->
                        <div id="clientFields" class="client-fields">
                            <div class="form-group">
                                <label>Job Title *</label>
                                <input type="text" id="cJobTitle" required placeholder="e.g. Fix leaking pipe">
                            </div>
                            <div class="form-group">
                                <label>Job Description *</label>
                                <textarea id="cJobDesc" required rows="3" placeholder="Describe what you need..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Location *</label>
                                <input type="text" id="cLocation" required placeholder="e.g. Molyko, Buea" value="Buea">
                            </div>
                            <div class="form-group">
                                <label>Budget (optional)</label>
                                <input type="text" id="cBudget" placeholder="e.g. 10,000 FCFA">
                            </div>
                            <!-- Client Portfolio -->
                            <div class="form-group">
                                <label>Reference Photos (optional, max 2)</label>
                                <div class="file-upload-group">
                                    <input type="file" id="cPortfolio" accept="image/jpeg,image/jpg,image/png,application/pdf" multiple>
                                    <small style="color: var(--text-light);">Upload photos of what needs fixing (JPEG, PNG, or PDF)</small>
                                </div>
                                <div class="file-preview" id="cPortfolioPreview"></div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary full">Create Account</button>
                    </form>
                </div>
                
                <p id="authMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            toggleFields();
            setupFilePreviews();
        });
        
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        function toggleFields() {
            const type = document.getElementById('regType').value;
            const workerFields = document.getElementById('workerFields');
            const clientFields = document.getElementById('clientFields');
            
            if (type === 'worker') {
                workerFields.classList.add('active');
                clientFields.classList.remove('active');
                document.querySelectorAll('#workerFields input, #workerFields select, #workerFields textarea').forEach(el => {
                    if (el.id !== 'wPortfolio') el.required = true;
                });
                document.querySelectorAll('#clientFields input, #clientFields select, #clientFields textarea').forEach(el => {
                    el.required = false;
                });
            } else {
                workerFields.classList.remove('active');
                clientFields.classList.add('active');
                document.querySelectorAll('#workerFields input, #workerFields select, #workerFields textarea').forEach(el => {
                    el.required = false;
                });
                document.querySelectorAll('#clientFields input, #clientFields select, #clientFields textarea').forEach(el => {
                    if (el.id !== 'cPortfolio' && el.id !== 'cBudget') el.required = true;
                });
            }
        }
        
        function handleCategoryChange() {
            const cat = document.getElementById('serviceCategory').value;
            const field = document.getElementById('customCategoryField');
            const input = document.getElementById('customCategory');
            if (cat === 'Others') {
                field.classList.add('active');
                input.required = true;
            } else {
                field.classList.remove('active');
                input.required = false;
            }
        }
        
        function setupFilePreviews() {
            ['wPortfolio', 'cPortfolio'].forEach(id => {
                const input = document.getElementById(id);
                if (!input) return;
                input.addEventListener('change', function() {
                    const previewId = id + 'Preview';
                    const preview = document.getElementById(previewId);
                    if (!preview) return;
                    preview.innerHTML = '';
                    Array.from(this.files).slice(0, 2).forEach(file => {
                        if (file.type.startsWith('image/')) {
                            const img = document.createElement('img');
                            img.className = 'file-preview-item';
                            img.src = URL.createObjectURL(file);
                            preview.appendChild(img);
                        } else {
                            const div = document.createElement('div');
                            div.className = 'file-preview-item';
                            div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.justifyContent = 'center';
                            div.style.background = '#f8fafc'; div.style.fontSize = '0.75rem';
                            div.textContent = '📄 ' + file.name;
                            preview.appendChild(div);
                        }
                    });
                });
            });
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        }
        
        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const fullName = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const isWorker = document.getElementById('regType').value === 'worker';
            
            // Get category (handle "Others")
            let category = document.getElementById('serviceCategory').value;
            if (category === 'Others') {
                category = document.getElementById('customCategory').value;
            }
            
            // Upload profile photo if selected
            let photoUrl = document.getElementById('regPhotoUrl').value || null;
            const photoFile = document.getElementById('regPhotoFile').files[0];
            if (photoFile && supabaseClient) {
                const uploaded = await uploadFile(photoFile, 'profiles');
                if (uploaded) photoUrl = uploaded;
            }
            
            // Step 1: Create auth account
            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: fullName, phone: phone, is_worker: isWorker } }
            });
            
            if (error) {
                showMessage(error.message, 'error');
                return;
            }
            
            const userId = data.user.id;
            
            // Step 2: Create profile
            const profileData = {
                id: userId,
                full_name: fullName,
                phone: phone,
                is_worker: isWorker,
                location: 'Buea',
                avatar_url: photoUrl,
                portfolio: []
            };
            
            const { error: profileError } = await supabaseClient
                .from('profiles').upsert([profileData], { onConflict: 'id' });
            
            if (profileError) {
                showMessage('Account created but profile error: ' + profileError.message, 'warning');
                return;
            }
            
            // Step 3: Create worker profile OR job post
            if (isWorker) {
                // Upload portfolio
                const portfolioFiles = document.getElementById('wPortfolio').files;
                const portfolioUrls = [];
                for (let f of Array.from(portfolioFiles).slice(0, 2)) {
                    const url = await uploadFile(f, 'portfolio');
                    if (url) portfolioUrls.push(url);
                }
                
                const workerDetails = {
                    id: userId,
                    category: category,
                    description: document.getElementById('wDescription').value,
                    experience_years: parseInt(document.getElementById('wExperience').value) || 0,
                    contact_phone: phone,
                    whatsapp_number: phone,
                    availability: 'Available',
                    portfolio: portfolioUrls
                };
                
                const { error: workerError } = await supabaseClient
                    .from('worker_details').insert([workerDetails]);
                
                if (workerError) {
                    showMessage('Account created but worker profile error: ' + workerError.message, 'warning');
                    return;
                }
            } else {
                // Upload client portfolio
                const portfolioFiles = document.getElementById('cPortfolio').files;
                const portfolioUrls = [];
                for (let f of Array.from(portfolioFiles).slice(0, 2)) {
                    const url = await uploadFile(f, 'portfolio');
                    if (url) portfolioUrls.push(url);
                }
                
                // Update profile with portfolio
                if (portfolioUrls.length > 0) {
                    await supabaseClient.from('profiles')
                        .update({ portfolio: portfolioUrls })
                        .eq('id', userId);
                }
                
                // Auto-create job post
                const jobData = {
                    client_id: userId,
                    title: document.getElementById('cJobTitle').value,
                    description: document.getElementById('cJobDesc').value,
                    category: category,
                    location: document.getElementById('cLocation').value || 'Buea',
                    budget: document.getElementById('cBudget').value || 'Not specified',
                    status: 'Open'
                };
                
                const { error: jobError } = await supabaseClient
                    .from('job_posts').insert([jobData]);
                
                if (jobError) {
                    showMessage('Account created but job post error: ' + jobError.message, 'warning');
                    return;
                }
            }
            
            showMessage('Account created successfully! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        }
        
        function showMessage(msg, type) {
            const el = document.getElementById('authMessage');
            el.textContent = msg;
            el.className = 'message ' + type;
        }
    </script>
</body>
</html>
