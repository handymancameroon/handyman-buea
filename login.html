    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        function getRedirectTarget() {
            var params = new URLSearchParams(window.location.search);
            var r = params.get('redirect');
            if (r === 'join') return 'join.html';
            return 'dashboard.html';
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await checkAuth();
            applyLanguage();

            if (currentUser) {
                window.location.href = getRedirectTarget();
                return;
            }

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    var n = document.getElementById('nav');
                    if (n) n.classList.toggle('active');
                });
            }
        });

        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('active', tab === 'login');
            document.getElementById('registerForm').classList.toggle('active', tab === 'register');
            document.getElementById('authTitle').textContent = tab === 'login' ? 'Login to Handy Man' : 'Create Account';
            document.getElementById('authMessage').textContent = '';
        }

        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function showAuthMessage(msg, type) {
            var el = document.getElementById('authMessage');
            el.textContent = msg;
            el.className = 'message ' + (type || '');
        }

        async function handleLogin(e) {
            e.preventDefault();
            showAuthMessage('Logging in...', '');

            try {
                if (!supabaseClient) {
                    showAuthMessage('System not ready. Please refresh the page.', 'error');
                    return;
                }

                var email = document.getElementById('loginEmail').value.trim();
                var password = document.getElementById('loginPassword').value;

                var { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showAuthMessage(error.message, 'error');
                    return;
                }

                showAuthMessage('Login successful! Redirecting...', 'success');
                setTimeout(function () {
                    window.location.href = getRedirectTarget();
                }, 800);
            } catch (err) {
                console.error(err);
                showAuthMessage('Login failed. Please try again.', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            showAuthMessage('Creating account...', '');

            try {
                if (!supabaseClient) {
                    showAuthMessage('System not ready. Please refresh the page.', 'error');
                    return;
                }

                var name = document.getElementById('regName').value.trim();
                var email = document.getElementById('regEmail').value.trim();
                var phone = document.getElementById('regPhone').value.trim();
                var town = document.getElementById('regTown').value;
                var type = document.getElementById('regType').value;
                var password = document.getElementById('regPassword').value;
                var password2 = document.getElementById('regPassword2').value;

                if (password !== password2) {
                    showAuthMessage('Passwords do not match.', 'error');
                    return;
                }
                if (password.length < 6) {
                    showAuthMessage('Password must be at least 6 characters.', 'error');
                    return;
                }

                var { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    showAuthMessage(error.message, 'error');
                    return;
                }

                if (data.user) {
                    await supabaseClient.from('profiles').upsert({
                        id: data.user.id,
                        full_name: name,
                        phone: phone,
                        location: town,
                        is_worker: type === 'worker',
                        is_admin: false,
                        is_deleted: false
                    }, { onConflict: 'id' });
                }

                showAuthMessage('Account created! Redirecting...', 'success');
                setTimeout(function () {
                    if (type === 'worker') {
                        window.location.href = 'join.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1200);
            } catch (err) {
                console.error(err);
                showAuthMessage('Registration failed. Please try again.', 'error');
            }
        }
    </script>
