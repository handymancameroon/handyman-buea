<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Handy Man Cameroon</title>
    <meta name="description" content="Login or create a free account on Handy Man Cameroon to find workers or offer your services.">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .auth-tabs button {
            flex: 1; padding: 12px; border: 1px solid #e2e8f0; background: #f8fafc;
            border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem;
        }
        .auth-tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .password-wrap { position: relative; }
        .password-wrap input { width: 100%; padding-right: 70px; }
        .toggle-password {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #2563eb; cursor: pointer; font-size: 0.85rem;
        }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        @media (max-width: 500px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="join.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <h2 id="authTitle">Login to Handy Man</h2>

                <div class="auth-tabs">
                    <button type="button" id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
                    <button type="button" id="tabRegister" onclick="switchTab('register')">Register</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="loginEmail" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="password-wrap">
                            <input type="password" id="loginPassword" required placeholder="Your password">
                            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary full">Login</button>
                </form>

                <!-- REGISTER FORM -->
                <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="regName" required placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="regEmail" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Phone (WhatsApp) *</label>
                        <input type="tel" id="regPhone" required placeholder="6XX XXX XXX">
                    </div>
                    <div class="form-group">
                        <label>Town *</label>
                        <select id="regTown" required>
                            <option value="">Select town</option>
                            <option value="Buea">Buea</option>
                            <option value="Limbe">Limbe</option>
                            <option value="Douala">Douala</option>
                            <option value="Yaoundé">Yaoundé</option>
                            <option value="Bamenda">Bamenda</option>
                            <option value="Bafoussam">Bafoussam</option>
                            <option value="Kribi">Kribi</option>
                            <option value="Garoua">Garoua</option>
                            <option value="Maroua">Maroua</option>
                            <option value="Ngaoundéré">Ngaoundéré</option>
                            <option value="Bertoua">Bertoua</option>
                            <option value="Ebolowa">Ebolowa</option>
                            <option value="Kumba">Kumba</option>
                            <option value="Dschang">Dschang</option>
                            <option value="Nkongsamba">Nkongsamba</option>
                            <option value="Edéa">Edéa</option>
                            <option value="Mutengene">Mutengene</option>
                            <option value="Tiko">Tiko</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>I want to *</label>
                        <select id="regType" required>
                            <option value="client">Find workers (Client)</option>
                            <option value="worker">Offer services (Worker)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="password-wrap">
                            <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters">
                            <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">Show</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <div class="password-wrap">
                            <input type="password" id="regPassword2" required minlength="6" placeholder="Enter password again">
                            <button type="button" class="toggle-password" onclick="togglePassword('regPassword2', this)">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary full">Create Account</button>
                </form>

                <p id="authMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            await checkAuth();
            applyLanguage();

            if (currentUser) {
                window.location.href = 'dashboard.html';
                return;
            }

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    var n = document.getElementById('nav');
                    if (n) n.classList.toggle('active');
                });
            }
        });

        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('active', tab === 'login');
            document.getElementById('registerForm').classList.toggle('active', tab === 'register');
            document.getElementById('authTitle').textContent = tab === 'login' ? 'Login to Handy Man' : 'Create Account';
            document.getElementById('authMessage').textContent = '';
        }

        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function showAuthMessage(msg, type) {
            var el = document.getElementById('authMessage');
            el.textContent = msg;
            el.className = 'message ' + (type || '');
        }

        async function handleLogin(e) {
            e.preventDefault();
            showAuthMessage('Logging in...', '');

            try {
                if (!supabaseClient) {
                    showAuthMessage('System not ready. Please refresh the page.', 'error');
                    return;
                }

                var email = document.getElementById('loginEmail').value.trim();
                var password = document.getElementById('loginPassword').value;

                var { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showAuthMessage(error.message, 'error');
                    return;
                }

                showAuthMessage('Login successful! Redirecting...', 'success');
                setTimeout(function () {
                    window.location.href = 'dashboard.html';
                }, 800);
            } catch (err) {
                console.error(err);
                showAuthMessage('Login failed. Please try again.', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            showAuthMessage('Creating account...', '');

            try {
                if (!supabaseClient) {
                    showAuthMessage('System not ready. Please refresh the page.', 'error');
                    return;
                }

                var name = document.getElementById('regName').value.trim();
                var email = document.getElementById('regEmail').value.trim();
                var phone = document.getElementById('regPhone').value.trim();
                var town = document.getElementById('regTown').value;
                var type = document.getElementById('regType').value;
                var password = document.getElementById('regPassword').value;
                var password2 = document.getElementById('regPassword2').value;

                if (password !== password2) {
                    showAuthMessage('Passwords do not match.', 'error');
                    return;
                }
                if (password.length < 6) {
                    showAuthMessage('Password must be at least 6 characters.', 'error');
                    return;
                }

                var { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    showAuthMessage(error.message, 'error');
                    return;
                }

                if (data.user) {
                    await supabaseClient.from('profiles').upsert({
                        id: data.user.id,
                        full_name: name,
                        phone: phone,
                        location: town,
                        is_worker: type === 'worker',
                        is_admin: false,
                        is_deleted: false
                    }, { onConflict: 'id' });
                }

                showAuthMessage('Account created! Redirecting...', 'success');
                setTimeout(function () {
                    if (type === 'worker') {
                        window.location.href = 'join.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1200);
            } catch (err) {
                console.error(err);
                showAuthMessage('Registration failed. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
