<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .portfolio-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--border); }
        .portfolio-img:hover { transform: scale(1.03); border-color: var(--primary); }
        .img-error { background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 0.85rem; }
        .rate-form { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
        .rate-form select, .rate-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; font-family: inherit; }
        .rate-form textarea { min-height: 90px; resize: vertical; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="profile-page">
        <div class="container" id="profileContainer">
            <p class="loading">Loading profile...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        let currentWorkerId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            setTimeout(async () => { await loadWorkerProfile(); }, 200);
        });

        async function loadWorkerProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('profileContainer');
            currentWorkerId = id;

            if (!id) {
                container.innerHTML = '<p class="error">Worker not found.</p>';
                return;
            }
            if (!supabaseClient) {
                container.innerHTML = '<p class="error">Cannot connect to database.</p>';
                return;
            }

            try {
                const { data: worker, error: workerError } = await supabaseClient
                    .from('worker_details')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (workerError || !worker) {
                    container.innerHTML = '<p class="error">Worker not found.</p>';
                    return;
                }

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, avatar_url, location, phone, portfolio, is_deleted')
                    .eq('id', id)
                    .single();

                if (profile && profile.is_deleted === true) {
                    container.innerHTML = '<p class="error">This worker profile is no longer available.</p>';
                    return;
                }

                const { data: reviews } = await supabaseClient
                    .from('reviews')
                    .select('*')
                    .eq('worker_id', id)
                    .order('created_at', { ascending: false });

                const p = profile || {};
                const phoneNum = (worker.whatsapp_number || p.phone || '').replace(/\D/g, '');
                let localPhone = phoneNum;
                if (localPhone.indexOf('237') === 0) localPhone = localPhone.substring(3);
                const whatsappLink = localPhone ? ('https://wa.me/237' + localPhone) : '#';
                const callLink = p.phone ? ('tel:' + p.phone) : '#';

                const avatarUrl = p.avatar_url || 'https://via.placeholder.com/120?text=No+Photo';

                let portfolio = [];
                if (worker.portfolio && Array.isArray(worker.portfolio) && worker.portfolio.length > 0) {
                    portfolio = worker.portfolio;
                } else if (p.portfolio && Array.isArray(p.portfolio) && p.portfolio.length > 0) {
                    portfolio = p.portfolio;
                }

                let portfolioHtml = '';
                if (portfolio.length > 0) {
                    portfolioHtml = `
                        <div class="profile-section">
                            <h3>📸 Portfolio (${portfolio.length} photo${portfolio.length > 1 ? 's' : ''})</h3>
                            <div class="portfolio-grid">
                                ${portfolio.map((url, i) => `
                                    <img src="${url}" class="portfolio-img"
                                         onerror="this.onerror=null;this.src='https://via.placeholder.com/180?text=Image+Not+Found';this.classList.add('img-error');"
                                         onclick="window.open('${url}', '_blank')"
                                         alt="Portfolio ${i+1}">
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                let reviewsHtml = '';
                if (reviews && reviews.length > 0) {
                    reviewsHtml = reviews.map(r => `
                        <div class="review">
                            <div class="review-header">
                                <strong>Client</strong>
                                <span>${'⭐'.repeat(r.rating || 0)} (${r.rating}/5)</span>
                            </div>
                            <p>${r.comment || 'No comment'}</p>
                        </div>
                    `).join('');
                } else {
                    reviewsHtml = '<p>No reviews yet. Be the first to rate this worker!</p>';
                }

                // Rating form – always visible when logged in and not viewing own profile
                let rateFormHtml = '';
                if (currentUser && currentUser.id !== id) {
                    rateFormHtml = `
                        <div class="rate-form" id="rateForm">
                            <h4>⭐ Leave a Rating for this Worker</h4>
                            <label>Your Rating</label>
                            <select id="ratingValue">
                                <option value="5">⭐⭐⭐⭐⭐ 5 Stars - Excellent</option>
                                <option value="4">⭐⭐⭐⭐ 4 Stars - Very Good</option>
                                <option value="3">⭐⭐⭐ 3 Stars - Good</option>
                                <option value="2">⭐⭐ 2 Stars - Fair</option>
                                <option value="1">⭐ 1 Star - Poor</option>
                            </select>
                            <label>Your Review / Comment (optional)</label>
                            <textarea id="ratingComment" placeholder="Tell others about your experience with this worker..."></textarea>
                            <button class="btn-primary" onclick="submitWorkerReview()" style="margin-top:12px;">Submit Rating & Comment</button>
                            <p id="rateMessage" class="message" style="display:none;"></p>
                        </div>
                    `;
                } else if (!currentUser) {
                    rateFormHtml = `
                        <div class="rate-form">
                            <p>Please <a href="login.html">login</a> to leave a rating and comment.</p>
                        </div>
                    `;
                }

                const safeName = (p.full_name || 'Unknown').replace(/'/g, "\\'");

                container.innerHTML = `
                    <div class="profile-header">
                        <img src="${avatarUrl}" class="profile-avatar"
                             onerror="this.onerror=null;this.src='https://via.placeholder.com/120?text=No+Photo'"
                             alt="${p.full_name || 'Worker'}">
                        <div class="profile-info">
                            <h1>${p.full_name || 'Unknown'}</h1>
                            <span class="badge">${worker.verified ? '✓ Verified' : 'New'}</span>
                            <p class="profile-category">${worker.category || 'General'}</p>
                            <p class="profile-location">📍 ${p.location || 'Cameroon'}</p>
                            <div class="profile-rating">
                                ${'⭐'.repeat(Math.round(worker.rating || 0))}
                                <span>${worker.rating || 0}/5 (${worker.review_count || 0} reviews)</span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-body">
                        <div class="profile-section">
                            <h3>About</h3>
                            <p>${worker.description || 'No description yet.'}</p>
                            <p style="margin-top:12px;"><strong>Experience:</strong> ${worker.experience_years || 0} years</p>
                            <p><strong>Availability:</strong> ${worker.availability || 'Available'}</p>
                        </div>

                        <div class="profile-section">
                            <h3>Contact</h3>
                            ${p.phone ? `<p>📞 ${p.phone}</p>` : ''}
                            <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            ${p.phone ? `<a href="${callLink}" class="btn-primary" style="margin-left:8px;">📞 Call Now</a>` : ''}
                            <div style="margin-top: 16px;">
                                <button onclick="reportWorker('${id}', '${safeName}')" class="btn-report">🚩 Report this worker</button>
                            </div>
                        </div>

                        ${portfolioHtml}

                        <div class="profile-section">
                            <h3>⭐ Reviews (${reviews ? reviews.length : 0})</h3>
                            <div id="reviewsList">
                                ${reviewsHtml}
                            </div>
                            ${rateFormHtml}
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error('Profile load error:', err);
                container.innerHTML = '<p class="error">Error loading profile. Please try again.</p>';
            }
        }

        async function submitWorkerReview() {
            if (!currentUser) {
                alert('Please login first to leave a review.');
                window.location.href = 'login.html';
                return;
            }

            const rating = parseInt(document.getElementById('ratingValue').value, 10);
            const comment = document.getElementById('ratingComment').value.trim();
            const msg = document.getElementById('rateMessage');

            if (!rating || rating < 1 || rating > 5) {
                alert('Please select a valid rating.');
                return;
            }

            try {
                // Try with extra columns first
                let { error } = await supabaseClient.from('reviews').insert([{
                    worker_id: currentWorkerId,
                    reviewer_id: currentUser.id,
                    rating: rating,
                    comment: comment || null,
                    review_type: 'worker'
                }]);

                if (error) {
                    // Fallback to basic columns
                    const { error: error2 } = await supabaseClient.from('reviews').insert([{
                        worker_id: currentWorkerId,
                        rating: rating,
                        comment: comment || null
                    }]);
                    if (error2) {
                        msg.textContent = 'Error: ' + error2.message;
                        msg.className = 'message error';
                        msg.style.display = 'block';
                        return;
                    }
                }

                // Recalculate average
                const { data: allReviews } = await supabaseClient
                    .from('reviews')
                    .select('rating')
                    .eq('worker_id', currentWorkerId);

                if (allReviews && allReviews.length > 0) {
                    const total = allReviews.reduce((sum, r) => sum + (r.rating || 0), 0);
                    const avg = Math.round((total / allReviews.length) * 10) / 10;

                    await supabaseClient
                        .from('worker_details')
                        .update({
                            rating: avg,
                            review_count: allReviews.length
                        })
                        .eq('id', currentWorkerId);
                }

                msg.textContent = 'Thank you! Your rating and comment have been submitted.';
                msg.className = 'message success';
                msg.style.display = 'block';

                setTimeout(() => {
                    loadWorkerProfile();
                }, 1500);

            } catch (err) {
                console.error('Review error:', err);
                alert('Something went wrong. Please try again.');
            }
        }

        function reportWorker(workerId, workerName) {
            window.location.href = 'report.html?type=worker&id=' + workerId + '&name=' + encodeURIComponent(workerName);
        }
    </script>
</body>
</html>
