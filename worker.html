<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Handy Man Cameroon</title>
    <meta name="description" content="View worker profile, portfolio, ratings and contact details on Handy Man Cameroon. Find trusted plumbers, electricians and skilled workers across Cameroon.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://handyman-buea.vercel.app/worker.html">
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Handy Man Cameroon">
    <meta property="og:title" content="Worker Profile - Handy Man Cameroon">
    <meta property="og:description" content="View worker profile, portfolio, ratings and contact details on Handy Man Cameroon.">
    <meta property="og:url" content="https://handyman-buea.vercel.app/worker.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Worker Profile - Handy Man Cameroon">
    <meta name="twitter:description" content="View worker profile, portfolio, ratings and contact details on Handy Man Cameroon.">
    <link rel="stylesheet" href="style.css">
    <style>
        .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .portfolio-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--border); }
        .portfolio-img:hover { transform: scale(1.03); border-color: var(--primary); }
        .img-error { background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 0.85rem; }
        .rate-form { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
        .rate-form select, .rate-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; font-family: inherit; }
        .rate-form textarea { min-height: 90px; resize: vertical; }
        .review { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .review:last-child { border-bottom: none; }
        .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .reviewer-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .reviewer-link { color: var(--primary); font-weight: 600; text-decoration: none; }
        .reviewer-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="login.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="profile-page">
        <div class="container" id="profileContainer">
            <p class="loading" data-i18n="loading_profile">Loading profile...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        let currentWorkerId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            applyLanguage();
            setTimeout(async () => { await loadWorkerProfile(); }, 200);
        });

        async function loadWorkerProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('profileContainer');
            currentWorkerId = id;

            if (!id) {
                container.innerHTML = '<p class="error">' + t('worker_not_found') + '</p>';
                return;
            }
            if (!supabaseClient) {
                container.innerHTML = '<p class="error">' + t('cannot_connect') + '</p>';
                return;
            }

            try {
                const { data: worker, error: workerError } = await supabaseClient
                    .from('worker_details')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (workerError || !worker) {
                    container.innerHTML = '<p class="error">' + t('worker_not_found') + '</p>';
                    return;
                }

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, avatar_url, location, phone, portfolio, is_deleted')
                    .eq('id', id)
                    .single();

                if (profile && profile.is_deleted === true) {
                    container.innerHTML = '<p class="error">' + t('profile_unavailable') + '</p>';
                    return;
                }

                // Get reviews
                const { data: reviews } = await supabaseClient
                    .from('reviews')
                    .select('*')
                    .eq('worker_id', id)
                    .order('created_at', { ascending: false });

                // Get reviewer profiles
                let reviewerMap = {};
                if (reviews && reviews.length > 0) {
                    const reviewerIds = reviews.map(r => r.reviewer_id).filter(Boolean);
                    if (reviewerIds.length > 0) {
                        const { data: reviewers } = await supabaseClient
                            .from('profiles')
                            .select('id, full_name, avatar_url, is_worker')
                            .in('id', reviewerIds);
                        if (reviewers) {
                            reviewers.forEach(r => { reviewerMap[r.id] = r; });
                        }
                    }
                }

                const p = profile || {};
                const phoneNum = (worker.whatsapp_number || p.phone || '').replace(/\D/g, '');
                let localPhone = phoneNum;
                if (localPhone.indexOf('237') === 0) localPhone = localPhone.substring(3);
                const whatsappLink = localPhone ? ('https://wa.me/237' + localPhone) : '#';
                const callLink = p.phone ? ('tel:' + p.phone) : '#';
                const avatarUrl = p.avatar_url || 'https://via.placeholder.com/120?text=No+Photo';

                let portfolio = [];
                if (worker.portfolio && Array.isArray(worker.portfolio) && worker.portfolio.length > 0) {
                    portfolio = worker.portfolio;
                } else if (p.portfolio && Array.isArray(p.portfolio) && p.portfolio.length > 0) {
                    portfolio = p.portfolio;
                }

                let portfolioHtml = '';
                if (portfolio.length > 0) {
                    const photoWord = portfolio.length > 1 ? t('photos') : t('photo');
                    portfolioHtml = `
                        <div class="profile-section">
                            <h3>📸 ${t('portfolio')} (${portfolio.length} ${photoWord})</h3>
                            <div class="portfolio-grid">
                                ${portfolio.map((url, i) => `
                                    <img src="${url}" class="portfolio-img"
                                         onerror="this.onerror=null;this.src='https://via.placeholder.com/180?text=Image+Not+Found';this.classList.add('img-error');"
                                         onclick="window.open('${url}', '_blank')"
                                         alt="Portfolio ${i+1}">
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // Calculate real rating from reviews
                let displayRating = worker.rating || 0;
                let displayCount = worker.review_count || 0;
                if (reviews && reviews.length > 0) {
                    const total = reviews.reduce((sum, r) => sum + (r.rating || 0), 0);
                    displayRating = Math.round((total / reviews.length) * 10) / 10;
                    displayCount = reviews.length;
                }

                // Build reviews HTML
                let reviewsHtml = '';
                if (reviews && reviews.length > 0) {
                    reviewsHtml = reviews.map(r => {
                        const rev = reviewerMap[r.reviewer_id] || {};
                        const revName = rev.full_name || 'Registered User';
                        const revAvatar = rev.avatar_url || 'https://via.placeholder.com/40?text=U';
                        const nameHtml = r.reviewer_id
                            ? (rev.is_worker
                                ? `<a class="reviewer-link" href="worker.html?id=${r.reviewer_id}">${revName}</a>`
                                : `<strong>${revName}</strong>`)
                            : `<strong>${revName}</strong>`;

                        return `
                            <div class="review">
                                <div class="review-header">
                                    <img src="${revAvatar}" class="reviewer-avatar" onerror="this.src='https://via.placeholder.com/40?text=U'" alt="">
                                    <div style="flex:1;">
                                        ${nameHtml}
                                        <div style="font-size:0.85rem;color:var(--text-light);">${'⭐'.repeat(r.rating || 0)} (${r.rating}/5)</div>
                                    </div>
                                </div>
                                <p>${r.comment || t('no_comment')}</p>
                            </div>
                        `;
                    }).join('');
                } else {
                    reviewsHtml = '<p>' + t('no_reviews_yet') + '</p>';
                }

                let rateFormHtml = '';
                if (currentUser && currentUser.id !== id) {
                    rateFormHtml = `
                        <div class="rate-form" id="rateForm">
                            <h4>⭐ ${t('leave_rating_worker')}</h4>
                            <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:8px;">${t('registered_only_reviews')}</p>
                            <label>${t('your_rating')}</label>
                            <select id="ratingValue">
                                <option value="5">⭐⭐⭐⭐⭐ ${t('rating_5')}</option>
                                <option value="4">⭐⭐⭐⭐ ${t('rating_4')}</option>
                                <option value="3">⭐⭐⭐ ${t('rating_3')}</option>
                                <option value="2">⭐⭐ ${t('rating_2')}</option>
                                <option value="1">⭐ ${t('rating_1')}</option>
                            </select>
                            <label>${t('your_review_comment')}</label>
                            <textarea id="ratingComment" placeholder="${t('tell_experience')}"></textarea>
                            <button class="btn-primary" onclick="submitWorkerReview()" style="margin-top:12px;">${t('submit_rating')}</button>
                            <p id="rateMessage" class="message" style="display:none;"></p>
                        </div>
                    `;
                } else if (!currentUser) {
                    rateFormHtml = `
                        <div class="rate-form">
                            <p>${t('login_to_rate').replace('login or register', '<a href="login.html">login or register</a>')}</p>
                        </div>
                    `;
                }

                const safeName = (p.full_name || 'Unknown').replace(/'/g, "\\'");
                const catDisplay = getCategoryDisplayName(worker.category || 'Others');
                const badgeText = worker.verified ? ('✓ ' + t('verified')) : t('new_badge');

                container.innerHTML = `
                    <div class="profile-header">
                        <img src="${avatarUrl}" class="profile-avatar"
                             onerror="this.onerror=null;this.src='https://via.placeholder.com/120?text=No+Photo'"
                             alt="${p.full_name || 'Worker'}">
                        <div class="profile-info">
                            <h1>${p.full_name || 'Unknown'}</h1>
                            <span class="badge">${badgeText}</span>
                            <p class="profile-category">${catDisplay}</p>
                            <p class="profile-location">📍 ${p.location || 'Cameroon'}</p>
                            <div class="profile-rating">
                                ${'⭐'.repeat(Math.round(displayRating || 0))}
                                <span>${displayRating}/5 (${displayCount} ${t('reviews')})</span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-body">
                        <div class="profile-section">
                            <h3>${t('about')}</h3>
                            <p>${worker.description || t('no_description')}</p>
                            <p style="margin-top:12px;"><strong>${t('experience')}:</strong> ${worker.experience_years || 0} ${t('years')}</p>
                            <p><strong>${t('availability')}:</strong> ${worker.availability || 'Available'}</p>
                        </div>

                        <div class="profile-section">
                            <h3>${t('contact')}</h3>
                            ${p.phone ? `<p>📞 ${p.phone}</p>` : ''}
                            <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 ${t('whatsapp')}</a>
                            ${p.phone ? `<a href="${callLink}" class="btn-primary" style="margin-left:8px;">📞 ${t('call_now')}</a>` : ''}
                            <div style="margin-top: 16px;">
                                <button onclick="reportWorker('${id}', '${safeName}')" class="btn-report">🚩 ${t('report_worker')}</button>
                            </div>
                        </div>

                        ${portfolioHtml}

                        <div class="profile-section">
                            <h3>⭐ ${t('reviews_title')} (${displayCount})</h3>
                            <div id="reviewsList">
                                ${reviewsHtml}
                            </div>
                            ${rateFormHtml}
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error('Profile load error:', err);
                container.innerHTML = '<p class="error">' + t('error_loading_profile') + '</p>';
            }
        }

        async function submitWorkerReview() {
            if (!currentUser) {
                alert(t('login_to_rate'));
                window.location.href = 'login.html';
                return;
            }

            const rating = parseInt(document.getElementById('ratingValue').value, 10);
            const comment = document.getElementById('ratingComment').value.trim();
            const msg = document.getElementById('rateMessage');

            if (!rating || rating < 1 || rating > 5) {
                alert('Please select a valid rating.');
                return;
            }

            try {
                let { error } = await supabaseClient.from('reviews').insert([{
                    worker_id: currentWorkerId,
                    reviewer_id: currentUser.id,
                    rating: rating,
                    comment: comment || null
                }]);

                if (error) {
                    const { error: error2 } = await supabaseClient.from('reviews').insert([{
                        worker_id: currentWorkerId,
                        rating: rating,
                        comment: comment || null
                    }]);
                    if (error2) {
                        msg.textContent = t('rating_error') + ' ' + error2.message;
                        msg.className = 'message error';
                        msg.style.display = 'block';
                        return;
                    }
                }

                // Recalculate average rating
                const { data: allReviews } = await supabaseClient
                    .from('reviews')
                    .select('rating')
                    .eq('worker_id', currentWorkerId);

                if (allReviews && allReviews.length > 0) {
                    const total = allReviews.reduce((sum, r) => sum + (r.rating || 0), 0);
                    const avg = Math.round((total / allReviews.length) * 10) / 10;
                    await supabaseClient.from('worker_details').update({
                        rating: avg,
                        review_count: allReviews.length
                    }).eq('id', currentWorkerId);
                }

                msg.textContent = t('rating_submitted');
                msg.className = 'message success';
                msg.style.display = 'block';

                setTimeout(() => loadWorkerProfile(), 1000);

            } catch (err) {
                msg.textContent = t('rating_error');
                msg.className = 'message error';
                msg.style.display = 'block';
            }
        }

        function reportWorker(id, name) {
            window.location.href = 'report.html?type=worker&id=' + id + '&name=' + encodeURIComponent(name);
        }
    </script>
</body>
</html>
