<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .portfolio-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--border); }
        .portfolio-img:hover { transform: scale(1.03); border-color: var(--primary); }
        .img-error { background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="profile-page">
        <div class="container" id="profileContainer">
            <p class="loading">Loading profile...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => { await loadWorkerProfile(); }, 100);
        });
        
        async function loadWorkerProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('profileContainer');
            
            if (!id) { container.innerHTML = '<p class="error">Worker not found.</p>'; return; }
            if (!supabaseClient) { container.innerHTML = '<p class="error">Cannot connect to database.</p>'; return; }
            
            try {
                const { data: worker, error: workerError } = await supabaseClient
                    .from('worker_details').select('*').eq('id', id).single();
                
                if (workerError || !worker) { container.innerHTML = '<p class="error">Worker not found.</p>'; return; }
                
                const { data: profile } = await supabaseClient
                    .from('profiles').select('full_name, avatar_url, location, phone, portfolio').eq('id', id).single();
                
                const { data: reviews } = await supabaseClient
                    .from('reviews').select('*').eq('worker_id', id);
                
                const p = profile || {};
                const phoneNum = (worker.whatsapp_number || p.phone || '').replace(/\D/g, '');
                const whatsappLink = phoneNum ? `https://wa.me/237${phoneNum}` : '#';
                const callLink = p.phone ? `tel:${p.phone}` : '#';
                
                // Handle avatar with fallback
                const avatarUrl = p.avatar_url || 'https://via.placeholder.com/120?text=No+Photo';
                
                // Portfolio - check both worker_details and profiles
                let portfolio = [];
                if (worker.portfolio && Array.isArray(worker.portfolio) && worker.portfolio.length > 0) {
                    portfolio = worker.portfolio;
                } else if (p.portfolio && Array.isArray(p.portfolio) && p.portfolio.length > 0) {
                    portfolio = p.portfolio;
                }
                
                let portfolioHtml = '';
                if (portfolio.length > 0) {
                    portfolioHtml = `
                        <div class="profile-section">
                            <h3>📸 Portfolio (${portfolio.length} photo${portfolio.length > 1 ? 's' : ''})</h3>
                            <div class="portfolio-grid">
                                ${portfolio.map((url, i) => `
                                    <img src="${url}" class="portfolio-img" onerror="this.onerror=null;this.src='https://via.placeholder.com/180?text=Image+Not+Found';this.classList.add('img-error');" onclick="window.open('${url}', '_blank')" alt="Portfolio ${i+1}">
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                
                container.innerHTML = `
                    <div class="profile-header">
                        <img src="${avatarUrl}" class="profile-avatar" onerror="this.onerror=null;this.src='https://via.placeholder.com/120?text=No+Photo'" alt="${p.full_name || 'Worker'}">
                        <div class="profile-info">
                            <h1>${p.full_name || 'Unknown'}</h1>
                            <span class="badge">${worker.verified ? '✓ Verified' : 'New'}</span>
                            <p class="profile-category">${worker.category || 'General'}</p>
                            <p class="profile-location">📍 ${p.location || 'Buea'}</p>
                            <div class="profile-rating">
                                ${'⭐'.repeat(Math.round(worker.rating || 0))} 
                                <span>${worker.rating || 0}/5 (${worker.review_count || 0} reviews)</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="profile-body">
                        <div class="profile-section">
                            <h3>About</h3>
                            <p>${worker.description || 'No description yet.'}</p>
                            <p><strong>Experience:</strong> ${worker.experience_years || 0} years</p>
                            <p><strong>Availability:</strong> ${worker.availability || 'Available'}</p>
                        </div>
                        
                        <div class="profile-section">
                            <h3>Contact</h3>
                            ${p.phone ? `<p>📞 ${p.phone}</p>` : ''}
                            <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            ${p.phone ? `<a href="${callLink}" class="btn-primary">📞 Call Now</a>` : ''}
                            <div style="margin-top: 16px;">
                                <button onclick="reportWorker('${id}', '${p.full_name || 'Unknown'}')" class="btn-report">🚩 Report this worker</button>
                            </div>
                        </div>
                        
                        ${portfolioHtml}
                        
                        <div class="profile-section">
                            <h3>Reviews</h3>
                            <div id="reviewsList">
                                ${reviews && reviews.length > 0 
                                    ? reviews.map(r => `
                                        <div class="review">
                                            <div class="review-header">
                                                <strong>Client</strong>
                                                <span>${'⭐'.repeat(r.rating || 0)}</span>
                                            </div>
                                            <p>${r.comment || ''}</p>
                                        </div>
                                    `).join('') 
                                    : '<p>No reviews yet.</p>'}
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (err) {
                console.error('Profile load error:', err);
                container.innerHTML = '<p class="error">Error loading profile. Please try again.</p>';
            }
        }
        
        function reportWorker(workerId, workerName) {
            window.location.href = `report.html?type=worker&id=${workerId}&name=${encodeURIComponent(workerName)}`;
        }
    </script>
</body>
</html>
