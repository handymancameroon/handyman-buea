<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Profile - HandyMan Cameroon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="workers.html">Back to Workers</a><a href="dashboard.html">My Profile</a></nav>

<div class="container" id="workerContainer">Loading worker...</div>

<div class="container" style="background:white;padding:20px;border-radius:12px;margin-top:16px;">
<h3>Leave a Review - Fixed Count (Photo + Link)</h3>
<select id="reviewRating"><option value="5">5 ⭐</option><option value="4">4 ⭐</option><option value="3">3 ⭐</option><option value="2">2 ⭐</option><option value="1">1 ⭐</option></select>
<input type="text" id="reviewerName" placeholder="Your Name" style="width:100%;padding:10px;margin:6px 0;">
<textarea id="reviewComment" placeholder="Your review..." style="width:100%;padding:10px;margin:6px 0;"></textarea>
<label>Photo (optional):</label><input type="file" id="reviewPhoto" accept="image/*">
<input type="url" id="reviewLink" placeholder="Profile link (Facebook, etc) optional" style="width:100%;padding:10px;margin:6px 0;">
<button onclick="submitReview()" class="btn">Submit Review</button>
<p id="reviewStatus"></p>
</div>

<div class="container" style="background:white;padding:20px;border-radius:12px;margin-top:16px;">
<h3>Reviews - Correct Count</h3><div id="reviewsList"></div>
</div>

<script>
let workerId=null; let workerProfile=null;
async function loadWorker(){
  const params=new URLSearchParams(window.location.search); workerId=params.get('id'); if(!workerId){ document.getElementById('workerContainer').innerHTML='No worker ID'; return; }
  const {data:w, error} = await supabaseClient.from('profiles').select('*').eq('id', workerId).single();
  if(error||!w){ document.getElementById('workerContainer').innerHTML='Worker not found'; return; }
  workerProfile=w;
  const avg = w.average_rating? Number(w.average_rating).toFixed(1) : '0.0'; const total = w.total_reviews||0;
  const photo = w.photo_url||w.avatar_url||'https://via.placeholder.com/150';
  document.getElementById('workerContainer').innerHTML=`
    <div style="background:white;padding:20px;border-radius:12px;display:flex;gap:20px;flex-wrap:wrap;">
      <img src="${photo}" style="width:150px;height:150px;border-radius:50%;object-fit:cover;">
      <div>
        <h1>${w.full_name}</h1>
        <p><b>${w.category||''}</b> - ${w.town||''}</p>
        <div class="rating-row"><span class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> <span>${avg} /5 (${total} reviews) - Fixed count</span></div>
        <p>${w.bio||''}</p>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          <a href="tel:${w.phone}" class="btn">📞 Call ${w.phone}</a>
          <a href="https://wa.me/${w.whatsapp||w.phone}" target="_blank" class="btn">WhatsApp</a>
          <button onclick="reportWorker()" class="btn-small" style="background:#ef4444!important;">Report</button>
        </div>
      </div>
    </div>`;
  loadReviews();
}
async function loadReviews(){
  const {data:reviews} = await supabaseClient.from('reviews').select('*').eq('worker_id', workerId).order('created_at',{ascending:false});
  document.getElementById('reviewsList').innerHTML=(reviews||[]).map(r=>`<div style="border-bottom:1px solid #eee;padding:10px 0;"><b>${r.reviewer_name||'Anon'}</b> - ⭐${r.rating}<br>${r.comment||''}<br>${r.photo_url?`<a href="${r.photo_url}" target="_blank">📷 Photo</a>`:''} ${r.profile_link?`<a href="${r.profile_link}" target="_blank">🔗 Link</a>`:''}<br><small>${r.created_at?.slice(0,10)}</small></div>`).join('') || 'No reviews yet';
}
async function submitReview(){
  const rating=parseInt(document.getElementById('reviewRating').value); const name=document.getElementById('reviewerName').value||'Anonymous'; const comment=document.getElementById('reviewComment').value; const link=document.getElementById('reviewLink').value;
  const file=document.getElementById('reviewPhoto').files[0]; let photoUrl=null;
  if(file){ photoUrl = await uploadFile(file, 'reviews', workerId); }
  const {data:{user}} = await supabaseClient.auth.getUser();
  const {error} = await supabaseClient.from('reviews').insert({worker_id:workerId, rating:rating, comment:comment, reviewer_name:name, photo_url:photoUrl, profile_link:link, reviewer_id:user?.id||null});
  if(error){ document.getElementById('reviewStatus').innerText='Error: '+error.message; return; }
  // Recalc average_rating and total_reviews - FIX
  const {data: allRevs} = await supabaseClient.from('reviews').select('rating').eq('worker_id', workerId);
  const total = allRevs.length; const avg = allRevs.reduce((s,r)=>s+r.rating,0)/total;
  await supabaseClient.from('profiles').update({average_rating:avg, total_reviews:total}).eq('id', workerId);
  document.getElementById('reviewStatus').innerText='Review submitted! Count updated: '+total+' reviews, avg '+avg.toFixed(1);
  loadWorker();
}
async function reportWorker(){
  const reason=prompt('Reason for report?'); if(!reason) return;
  const {data:{user}} = await supabaseClient.auth.getUser(); if(!user){ alert('Login to report'); location.href='login.html'; return; }
  await supabaseClient.from('reports').insert({reporter_id:user.id, reported_id:workerId, reason:reason, status:'pending'});
  alert('Report submitted - admin will see both sides with call/WhatsApp/message');
}
loadWorker();
</script>
<script src="app.js"></script>
</body>
</html>
