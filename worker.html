<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Handy Man Cameroon</title>
    <meta name="description" content="View worker profile, portfolio, ratings and contact details on Handy Man Cameroon.">
    <link rel="stylesheet" href="style.css">
    <style>
        .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .portfolio-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid var(--border); }
        .rate-form { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
        .rate-form select, .rate-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; font-family: inherit; }
        .review { padding: 16px 0; border-bottom: 1px solid var(--border); }
        .review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .reviewer-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .reviewer-link { color: var(--primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="profile-page">
        <div class="container" id="profileContainer">
            <p class="loading">Loading profile...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        let currentWorkerId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            setTimeout(loadWorkerProfile, 200);
        });

        async function loadWorkerProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('profileContainer');
            currentWorkerId = id;

            if (!id || !supabaseClient) {
                container.innerHTML = '<p class="error">Worker not found.</p>';
                return;
            }

            try {
                const { data: worker, error } = await supabaseClient
                    .from('worker_details')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error || !worker) {
                    container.innerHTML = '<p class="error">Worker not found.</p>';
                    return;
                }

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('full_name, avatar_url, location, phone, is_deleted')
                    .eq('id', id)
                    .single();

                if (profile && profile.is_deleted === true) {
                    container.innerHTML = '<p class="error">This profile is no longer available.</p>';
                    return;
                }

                // Reviews
                const { data: reviews } = await supabaseClient
                    .from('reviews')
                    .select('*')
                    .eq('worker_id', id)
                    .order('created_at', { ascending: false });

                let reviewerMap = {};
                if (reviews && reviews.length > 0) {
                    const ids = reviews.map(r => r.reviewer_id).filter(Boolean);
                    if (ids.length) {
                        const { data: reviewers } = await supabaseClient
                            .from('profiles')
                            .select('id, full_name, avatar_url, is_worker')
                            .in('id', ids);
                        if (reviewers) reviewers.forEach(r => reviewerMap[r.id] = r);
                    }
                }

                // Real rating from reviews
                let displayRating = Number(worker.rating) || 0;
                let displayCount = Number(worker.review_count) || 0;
                if (reviews && reviews.length > 0) {
                    const total = reviews.reduce((s, r) => s + (Number(r.rating) || 0), 0);
                    displayRating = Math.round((total / reviews.length) * 10) / 10;
                    displayCount = reviews.length;
                }

                const p = profile || {};
                const phoneNum = (worker.whatsapp_number || p.phone || '').replace(/\D/g, '');
                let localPhone = phoneNum;
                if (localPhone.indexOf('237') === 0) localPhone = localPhone.substring(3);
                const whatsappLink = localPhone ? 'https://wa.me/237' + localPhone : '#';
                const callLink = p.phone ? 'tel:' + p.phone : '#';
                const avatarUrl = p.avatar_url || 'https://via.placeholder.com/120?text=No+Photo';

                let portfolio = Array.isArray(worker.portfolio) ? worker.portfolio : [];

                let portfolioHtml = '';
                if (portfolio.length > 0) {
                    portfolioHtml = `
                        <div class="profile-section">
                            <h3>📸 Portfolio</h3>
                            <div class="portfolio-grid">
                                ${portfolio.map((url, i) => `
                                    <img src="${url}" class="portfolio-img"
                                         onerror="this.src='https://via.placeholder.com/180?text=Image'"
                                         onclick="window.open('${url}', '_blank')" alt="Work ${i+1}">
                                `).join('')}
                            </div>
                        </div>`;
                }

                let reviewsHtml = '';
                if (reviews && reviews.length > 0) {
                    reviewsHtml = reviews.map(r => {
                        const rev = reviewerMap[r.reviewer_id] || {};
                        const revName = rev.full_name || 'Registered User';
                        const revAvatar = rev.avatar_url || 'https://via.placeholder.com/40?text=U';
                        const nameHtml = r.reviewer_id
                            ? (rev.is_worker
                                ? `<a class="reviewer-link" href="worker.html?id=${r.reviewer_id}">${revName}</a>`
                                : `<strong>${revName}</strong>`)
                            : `<strong>${revName}</strong>`;

                        return `
                            <div class="review">
                                <div class="review-header">
                                    <img src="${revAvatar}" class="reviewer-avatar" onerror="this.src='https://via.placeholder.com/40?text=U'">
                                    <div style="flex:1;">
                                        ${nameHtml}
                                        <div style="font-size:0.85rem;color:var(--text-light);">${'⭐'.repeat(r.rating || 0)} (${r.rating}/5)</div>
                                    </div>
                                </div>
                                <p>${r.comment || 'No comment'}</p>
                            </div>`;
                    }).join('');
                } else {
                    reviewsHtml = '<p>No reviews yet. Be the first to rate this worker!</p>';
                }

                let rateFormHtml = '';
                if (currentUser && currentUser.id !== id) {
                    rateFormHtml = `
                        <div class="rate-form" id="rateForm">
                            <h4>⭐ Leave a Rating</h4>
                            <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:8px;">Only registered users can leave reviews. Your photo and name will appear.</p>
                            <label>Your Rating</label>
                            <select id="ratingValue">
                                <option value="5">⭐⭐⭐⭐⭐ 5 – Excellent</option>
                                <option value="4">⭐⭐⭐⭐ 4 – Very Good</option>
                                <option value="3">⭐⭐⭐ 3 – Good</option>
                                <option value="2">⭐⭐ 2 – Fair</option>
                                <option value="1">⭐ 1 – Poor</option>
                            </select>
                            <label>Your Comment (optional)</label>
                            <textarea id="ratingComment" placeholder="Tell others about your experience..."></textarea>
                            <button class="btn-primary" onclick="submitWorkerReview()" style="margin-top:12px;">Submit Rating</button>
                            <p id="rateMessage" class="message" style="display:none;"></p>
                        </div>`;
                } else if (!currentUser) {
                    rateFormHtml = `
                        <div class="rate-form">
                            <p>Please <a href="login.html">login or register</a> to leave a rating.</p>
                        </div>`;
                }

                container.innerHTML = `
                    <div class="profile-header">
                        <img src="${avatarUrl}" class="profile-avatar" onerror="this.src='https://via.placeholder.com/120?text=No+Photo'">
                        <div class="profile-info">
                            <h1>${p.full_name || 'Unknown'}</h1>
                            <span class="badge">${worker.verified ? '✓ Verified' : 'New'}</span>
                            <p class="profile-category">${worker.category || 'General'}</p>
                            <p class="profile-location">📍 ${p.location || 'Cameroon'}</p>
                            <div class="profile-rating">
                                ${'⭐'.repeat(Math.round(displayRating || 0))}
                                <span>${displayRating}/5 (${displayCount} reviews)</span>
                            </div>
                        </div>
                    </div>

                    <div class="profile-body">
                        <div class="profile-section">
                            <h3>About</h3>
                            <p>${worker.description || 'No description yet.'}</p>
                            <p style="margin-top:12px;"><strong>Experience:</strong> ${worker.experience_years || 0} years</p>
                            <p><strong>Availability:</strong> ${worker.availability || 'Available'}</p>
                        </div>

                        <div class="profile-section">
                            <h3>Contact</h3>
                            ${p.phone ? `<p>📞 ${p.phone}</p>` : ''}
                            <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            ${p.phone ? `<a href="${callLink}" class="btn-primary" style="margin-left:8px;">📞 Call</a>` : ''}
                            <div style="margin-top:16px;">
                                <a href="report.html?type=worker&id=${id}&name=${encodeURIComponent(p.full_name || '')}" class="btn-report">🚩 Report this profile</a>
                            </div>
                        </div>

                        ${portfolioHtml}

                        <div class="profile-section">
                            <h3>Reviews (${displayCount})</h3>
                            ${reviewsHtml}
                        </div>

                        ${rateFormHtml}
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="error">Could not load profile.</p>';
            }
        }

        async function submitWorkerReview() {
            if (!currentUser || !currentWorkerId) return;
            const rating = parseInt(document.getElementById('ratingValue').value);
            const comment = document.getElementById('ratingComment').value.trim();
            const msg = document.getElementById('rateMessage');

            try {
                // Prevent double review (simple check)
                const { data: existing } = await supabaseClient
                    .from('reviews')
                    .select('id')
                    .eq('worker_id', currentWorkerId)
                    .eq('reviewer_id', currentUser.id)
                    .maybeSingle();

                if (existing) {
                    msg.style.display = 'block';
                    msg.className = 'message error';
                    msg.textContent = 'You already reviewed this worker.';
                    return;
                }

                const { error } = await supabaseClient.from('reviews').insert({
                    worker_id: currentWorkerId,
                    reviewer_id: currentUser.id,
                    rating: rating,
                    comment: comment || null
                });

                if (error) throw error;

                // Update the rating on worker_details
                if (typeof recalculateWorkerRating === 'function') {
                    await recalculateWorkerRating(currentWorkerId);
                }

                msg.style.display = 'block';
                msg.className = 'message success';
                msg.textContent = 'Thank you! Your review has been submitted.';
                setTimeout(() => loadWorkerProfile(), 1200);
            } catch (err) {
                console.error(err);
                msg.style.display = 'block';
                msg.className = 'message error';
                msg.textContent = 'Could not submit review. Please try again.';
            }
        }
    </script>
</body>
</html>
