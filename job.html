<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-banner {
            padding: 16px 24px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-open {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #86efac;
        }
        .status-closed {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
        }
        .client-contact-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .client-contact-box p { margin-bottom: 12px; font-size: 1rem; }
        .client-contact-box .phone-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .client-avatar-small {
            width: 60px; height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .contact-buttons a { flex: 1; min-width: 140px; text-align: center; }
        .tips-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .tips-box h4 {
            color: #1e40af;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .tips-box ul {
            margin: 0;
            padding-left: 20px;
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .tips-box li {
            margin-bottom: 6px;
        }
        .owner-notice {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .owner-notice p {
            margin: 0;
            color: #92400e;
            font-size: 0.95rem;
        }
        .owner-notice a {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="job-detail-page">
        <div class="container" id="jobContainer">
            <p class="loading">Loading job...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        let currentJob = null;
        let currentJobId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => {
                await loadJobDetail();
            }, 100);
        });
        
        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('jobContainer');
            currentJobId = id;
            
            if (!id) {
                container.innerHTML = '<p class="error">Job not found.</p>';
                return;
            }
            
            if (!supabaseClient) {
                container.innerHTML = '<p class="error">Cannot connect to database.</p>';
                return;
            }
            
            try {
                const { data: job, error } = await supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name, phone, avatar_url, location)')
                    .eq('id', id)
                    .single();
                
                if (error || !job) {
                    container.innerHTML = '<p class="error">Job not found.</p>';
                    return;
                }
                
                currentJob = job;
                const p = job.profiles || {};
                const phoneNum = (p.phone || '').replace(/\D/g, '');
                const whatsappLink = phoneNum ? `https://wa.me/237${phoneNum}` : '#';
                const callLink = p.phone ? `tel:${p.phone}` : '#';
                const postedDate = new Date(job.created_at).toLocaleDateString('en-GB');
                
                // Check if current user is the job owner
                const { data: { user } } = await supabaseClient.auth.getUser();
                const isOwner = user && user.id === job.client_id;
                
                // Determine status display
                const isOpen = job.status === 'Open';
                const statusBannerClass = isOpen ? 'status-open' : 'status-closed';
                const statusText = isOpen ? '🟢 OPEN — Workers Can Apply' : '🔴 CLOSED — No Longer Accepting Applications';
                
                // Owner notice + tips for job posters
                let ownerSection = '';
                if (isOwner) {
                    if (isOpen) {
                        ownerSection = `
                            <div class="owner-notice">
                                <p>💡 <strong>This is your job posting.</strong> You can close it anytime from your <a href="dashboard.html">Dashboard</a> when you have found a worker.</p>
                            </div>
                            <div class="tips-box">
                                <h4>💡 Tips for Job Posters</h4>
                                <ul>
                                    <li>Respond to worker inquiries quickly — good workers get booked fast.</li>
                                    <li>Be clear about your budget and timeline to avoid misunderstandings.</li>
                                    <li>Ask for references or past work photos before hiring.</li>
                                    <li>Agree on payment terms (Mobile Money, cash) before work starts.</li>
                                    <li>Close the job on your Dashboard once you have found someone.</li>
                                    <li>Leave a review after the job is completed to help other clients.</li>
                                </ul>
                            </div>
                        `;
                    } else {
                        ownerSection = `
                            <div class="owner-notice">
                                <p>✅ <strong>This job is closed.</strong> You marked it as taken. If you need more help, <a href="post-job.html">post a new job</a>.</p>
                            </div>
                        `;
                    }
                }
                
                // Contact section for workers
                let contactSection = '';
                if (isOpen) {
                    if (p.phone) {
                        contactSection = `
                            <div class="client-contact-box">
                                <p style="color: var(--text-light); margin-bottom: 8px;">📞 Contact the client about this job:</p>
                                <p class="phone-display">📱 ${p.phone}</p>
                                <div class="contact-buttons">
                                    <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                                    <a href="${callLink}" class="btn-primary">📞 Call Now</a>
                                </div>
                            </div>
                        `;
                    } else {
                        contactSection = `<p style="color: var(--text-light);">This client has not provided a phone number.</p>`;
                    }
                } else {
                    contactSection = `<p style="color: var(--text-light); font-weight: 600;">This job is closed and no longer accepting applications.</p>`;
                }
                
                // Tips for workers (only show on open jobs)
                let workerTips = '';
                if (isOpen && !isOwner) {
                    workerTips = `
                        <div class="tips-box">
                            <h4>💡 Tips for Workers</h4>
                            <ul>
                                <li>Always confirm details, pricing, and timing before starting.</li>
                                <li>Ask for the client's exact location in Buea.</li>
                                <li>Discuss payment method (cash, Mobile Money) upfront.</li>
                                <li>Be professional and arrive on time.</li>
                                <li>Bring your own tools unless the client says otherwise.</li>
                                <li>Ask the client to close the job once work is done.</li>
                            </ul>
                        </div>
                    `;
                }
                
                container.innerHTML = `
                    <div class="status-banner ${statusBannerClass}">
                        ${statusText}
                    </div>
                    
                    <div class="job-detail-header">
                        <div style="width: 100%;">
                            <h1>${job.title}</h1>
                            <p class="job-detail-category">${job.category || 'General'}</p>
                            <div class="job-meta">
                                <span>📍 ${job.location || 'Buea'}</span>
                                <span>💰 ${job.budget || 'Not specified'}</span>
                                <span>📅 Posted ${postedDate}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${ownerSection}
                    
                    <div class="job-description">
                        <h3>Job Description</h3>
                        <p>${job.description}</p>
                    </div>
                    
                    <div class="client-info">
                        <h3>Client Information</h3>
                        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
                            <img src="${p.avatar_url || 'https://via.placeholder.com/60'}" class="client-avatar-small" alt="${p.full_name || 'Client'}">
                            <div>
                                <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">${p.full_name || 'Anonymous'}</p>
                                <p style="color: var(--text-light); font-size: 0.9rem;">📍 ${p.location || 'Buea'}</p>
                            </div>
                        </div>
                        ${contactSection}
                    </div>
                    
                    ${workerTips}
                `;
                
            } catch (err) {
                console.error('Job load error:', err);
                container.innerHTML = '<p class="error">Error loading job. Please try again.</p>';
            }
        }
    </script>
</body>
</html>
