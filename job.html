<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-banner { padding: 16px 24px; border-radius: 12px; text-align: center; margin-bottom: 24px; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        .status-open { background: #dcfce7; color: #166534; border: 2px solid #86efac; }
        .status-closed { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        .client-contact-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 20px; margin-top: 16px; }
        .client-contact-box p { margin-bottom: 12px; font-size: 1rem; }
        .client-contact-box .phone-display { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
        .client-avatar-small { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; }
        .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .contact-buttons a { flex: 1; min-width: 140px; text-align: center; }
        .tips-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 20px; margin-top: 16px; }
        .tips-box h4 { color: #1e40af; margin-bottom: 12px; font-size: 1rem; }
        .tips-box ul { margin: 0; padding-left: 20px; color: var(--text-light); font-size: 0.9rem; line-height: 1.7; }
        .tips-box li { margin-bottom: 6px; }
        .owner-notice { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; }
        .owner-notice p { margin: 0; color: #92400e; font-size: 0.95rem; }
        .owner-notice a { color: var(--primary); font-weight: 600; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
        .portfolio-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; border: 2px solid var(--border); }
        .portfolio-img:hover { transform: scale(1.03); border-color: var(--primary); }
        .img-error { background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: var(--text-light); font-size: 0.85rem; }
        .report-section { margin-top: 20px; text-align: center; }
        .rate-form { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
        .rate-form select, .rate-form textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; font-family: inherit; }
        .rate-form textarea { min-height: 90px; resize: vertical; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="job-detail-page">
        <div class="container" id="jobContainer">
            <p class="loading">Loading job...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        let currentJob = null;
        let currentJobId = null;
        let clientId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            setTimeout(async () => { await loadJobDetail(); }, 200);
        });

        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('jobContainer');
            currentJobId = id;

            if (!id) { container.innerHTML = '<p class="error">Job not found.</p>'; return; }
            if (!supabaseClient) { container.innerHTML = '<p class="error">Cannot connect to database.</p>'; return; }

            try {
                const { data: job, error } = await supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name, phone, avatar_url, location, portfolio)')
                    .eq('id', id)
                    .single();

                if (error || !job) { container.innerHTML = '<p class="error">Job not found.</p>'; return; }

                currentJob = job;
                clientId = job.client_id;
                const p = job.profiles || {};
                const phoneNum = (p.phone || '').replace(/\D/g, '');
                let local = phoneNum;
                if (local.indexOf('237') === 0) local = local.substring(3);
                const whatsappLink = local ? `https://wa.me/237${local}` : '#';
                const callLink = p.phone ? `tel:${p.phone}` : '#';
                const postedDate = new Date(job.created_at).toLocaleDateString('en-GB');

                const isOwner = currentUser && currentUser.id === job.client_id;
                const isOpen = job.status === 'Open';
                const statusBannerClass = isOpen ? 'status-open' : 'status-closed';
                const statusText = isOpen ? '🟢 OPEN — Workers Can Apply' : '🔴 CLOSED — No Longer Accepting Applications';

                const avatarUrl = p.avatar_url || 'https://via.placeholder.com/60?text=No+Photo';

                let portfolio = [];
                if (job.images && Array.isArray(job.images) && job.images.length > 0) {
                    portfolio = job.images;
                } else if (p.portfolio && Array.isArray(p.portfolio) && p.portfolio.length > 0) {
                    portfolio = p.portfolio;
                }

                let portfolioHtml = '';
                if (portfolio.length > 0) {
                    portfolioHtml = `
                        <div class="profile-section">
                            <h3>📸 Reference Photos (${portfolio.length})</h3>
                            <div class="portfolio-grid">
                                ${portfolio.map((url, i) => `
                                    <img src="${url}" class="portfolio-img" onerror="this.onerror=null;this.src='https://via.placeholder.com/180?text=Image+Not+Found';this.classList.add('img-error');" onclick="window.open('${url}', '_blank')" alt="Reference ${i+1}">
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // Load reviews for this client (we store client ratings using worker_id = client_id + review_type)
                let clientReviewsHtml = '<p>No ratings for this client yet.</p>';
                try {
                    const { data: clientReviews } = await supabaseClient
                        .from('reviews')
                        .select('*')
                        .eq('worker_id', job.client_id)
                        .order('created_at', { ascending: false });
                    if (clientReviews && clientReviews.length > 0) {
                        clientReviewsHtml = clientReviews.map(r => `
                            <div class="review">
                                <div class="review-header">
                                    <strong>Reviewer</strong>
                                    <span>${'⭐'.repeat(r.rating || 0)} (${r.rating}/5)</span>
                                </div>
                                <p>${r.comment || 'No comment'}</p>
                            </div>
                        `).join('');
                    }
                } catch (e) {}

                // Rating form for the client
                let rateClientHtml = '';
                if (currentUser && currentUser.id !== job.client_id) {
                    rateClientHtml = `
                        <div class="rate-form" id="rateClientForm">
                            <h4>⭐ Rate this Client</h4>
                            <label>Your Rating</label>
                            <select id="clientRatingValue">
                                <option value="5">⭐⭐⭐⭐⭐ 5 Stars - Excellent</option>
                                <option value="4">⭐⭐⭐⭐ 4 Stars - Very Good</option>
                                <option value="3">⭐⭐⭐ 3 Stars - Good</option>
                                <option value="2">⭐⭐ 2 Stars - Fair</option>
                                <option value="1">⭐ 1 Star - Poor</option>
                            </select>
                            <label>Your Comment (optional)</label>
                            <textarea id="clientRatingComment" placeholder="How was working with this client?"></textarea>
                            <button class="btn-primary" onclick="submitClientReview()" style="margin-top:12px;">Submit Rating & Comment</button>
                            <p id="clientRateMessage" class="message" style="display:none;"></p>
                        </div>
                    `;
                } else if (!currentUser) {
                    rateClientHtml = `
                        <div class="rate-form">
                            <p>Please <a href="login.html">login</a> to rate this client.</p>
                        </div>
                    `;
                }

                let ownerSection = '';
                if (isOwner) {
                    if (isOpen) {
                        ownerSection = `
                            <div class="owner-notice">
                                <p>💡 <strong>This is your job.</strong> Close it from your <a href="dashboard.html">Dashboard</a> when done.</p>
                            </div>
                        `;
                    } else {
                        ownerSection = `
                            <div class="owner-notice">
                                <p>✅ <strong>This job is closed.</strong> <a href="post-job.html">Post a new job</a> if you need more help.</p>
                            </div>
                        `;
                    }
                }

                let contactSection = '';
                if (isOpen) {
                    if (p.phone) {
                        contactSection = `
                            <div class="client-contact-box">
                                <p style="color: var(--text-light); margin-bottom: 8px;">📞 Contact the client:</p>
                                <p class="phone-display">📱 ${p.phone}</p>
                                <div class="contact-buttons">
                                    <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                                    <a href="${callLink}" class="btn-primary">📞 Call Now</a>
                                </div>
                            </div>
                        `;
                    } else {
                        contactSection = `<p style="color: var(--text-light);">No phone number provided.</p>`;
                    }
                } else {
                    contactSection = `<p style="color: var(--text-light); font-weight: 600;">This job is closed.</p>`;
                }

                container.innerHTML = `
                    <div class="status-banner ${statusBannerClass}">${statusText}</div>
                    
                    <div class="job-detail-header">
                        <div style="width: 100%;">
                            <h1>${job.title}</h1>
                            <p class="job-detail-category">${job.category || 'General'}</p>
                            <div class="job-meta">
                                <span>📍 ${job.location || 'Cameroon'}</span>
                                <span>💰 ${job.budget || 'Not specified'}</span>
                                <span>📅 Posted ${postedDate}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${ownerSection}
                    
                    <div class="job-description">
                        <h3>Job Description</h3>
                        <p>${job.description}</p>
                    </div>
                    
                    ${portfolioHtml}
                    
                    <div class="client-info">
                        <h3>Client Information</h3>
                        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
                            <img src="${avatarUrl}" class="client-avatar-small" onerror="this.onerror=null;this.src='https://via.placeholder.com/60?text=No+Photo'" alt="${p.full_name || 'Client'}">
                            <div>
                                <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">${p.full_name || 'Anonymous'}</p>
                                <p style="color: var(--text-light); font-size: 0.9rem;">📍 ${p.location || 'Cameroon'}</p>
                            </div>
                        </div>
                        ${contactSection}
                        <div class="report-section">
                            <button onclick="reportJob('${id}', '${(job.title || '').replace(/'/g, "\\'")}')" class="btn-report">🚩 Report this job</button>
                        </div>
                    </div>

                    <div class="profile-section" style="margin-top:24px;">
                        <h3>⭐ Ratings for this Client</h3>
                        <div id="clientReviewsList">${clientReviewsHtml}</div>
                        ${rateClientHtml}
                    </div>
                `;

            } catch (err) {
                console.error('Job load error:', err);
                container.innerHTML = '<p class="error">Error loading job. Please try again.</p>';
            }
        }

        async function submitClientReview() {
            if (!currentUser) {
                alert('Please login first.');
                window.location.href = 'login.html';
                return;
            }
            if (!clientId) {
                alert('Client ID missing.');
                return;
            }

            const rating = parseInt(document.getElementById('clientRatingValue').value, 10);
            const comment = document.getElementById('clientRatingComment').value.trim();
            const msg = document.getElementById('clientRateMessage');

            if (!rating || rating < 1 || rating > 5) {
                alert('Please select a valid rating.');
                return;
            }

            try {
                let { error } = await supabaseClient.from('reviews').insert([{
                    worker_id: clientId,          // we reuse worker_id column for the person being rated
                    reviewer_id: currentUser.id,
                    rating: rating,
                    comment: comment || null,
                    review_type: 'client'
                }]);

                if (error) {
                    // Fallback
                    const { error: error2 } = await supabaseClient.from('reviews').insert([{
                        worker_id: clientId,
                        rating: rating,
                        comment: comment || null
                    }]);
                    if (error2) {
                        msg.textContent = 'Error: ' + error2.message;
                        msg.className = 'message error';
                        msg.style.display = 'block';
                        return;
                    }
                }

                msg.textContent = 'Thank you! Your rating of the client has been submitted.';
                msg.className = 'message success';
                msg.style.display = 'block';

                setTimeout(() => loadJobDetail(), 1500);
            } catch (err) {
                console.error(err);
                alert('Something went wrong. Please try again.');
            }
        }

        function reportJob(jobId, title) {
            window.location.href = `report.html?type=job&id=${jobId}&name=${encodeURIComponent(title)}`;
        }
    </script>
</body>
</html>
