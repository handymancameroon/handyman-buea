<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .client-contact-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .client-contact-box p {
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .client-contact-box .phone-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .client-avatar-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .contact-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .contact-buttons a {
            flex: 1;
            min-width: 140px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="job-detail-page">
        <div class="container" id="jobContainer">
            <p class="loading">Loading job...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        let currentJob = null;
        let currentJobId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => {
                await loadJobDetail();
            }, 100);
        });
        
        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('jobContainer');
            currentJobId = id;
            
            if (!id) {
                container.innerHTML = '<p class="error">Job not found.</p>';
                return;
            }
            
            if (!supabaseClient) {
                container.innerHTML = '<p class="error">Cannot connect to database.</p>';
                return;
            }
            
            try {
                const { data: job, error } = await supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name, phone, avatar_url, location)')
                    .eq('id', id)
                    .single();
                
                if (error || !job) {
                    container.innerHTML = '<p class="error">Job not found.</p>';
                    return;
                }
                
                currentJob = job;
                const p = job.profiles || {};
                const phoneNum = (p.phone || '').replace(/\D/g, '');
                const whatsappLink = phoneNum ? `https://wa.me/237${phoneNum}` : '#';
                const callLink = p.phone ? `tel:${p.phone}` : '#';
                const postedDate = new Date(job.created_at).toLocaleDateString('en-GB');
                
                // Check if current user is the job owner
                const { data: { user } } = await supabaseClient.auth.getUser();
                const isOwner = user && user.id === job.client_id;
                
                // Status color
                let statusColor = 'var(--success)';
                if (job.status === 'Taken') statusColor = 'var(--warning)';
                
                // Status section - ONLY owner sees action buttons
                let statusSection = '';
                if (isOwner) {
                    if (job.status === 'Open') {
                        statusSection = `
                            <div style="margin-bottom: 16px;">
                                <button onclick="updateStatus('Taken')" class="btn-primary">✅ Mark as Taken</button>
                                <p style="color: var(--text-light); margin-top: 8px; font-size: 0.875rem;">Click this when you have found a worker for this job.</p>
                            </div>
                        `;
                    } else if (job.status === 'Taken') {
                        statusSection = `
                            <div style="margin-bottom: 16px;">
                                <span style="color: var(--warning); font-weight: 600; font-size: 1.1rem;">⚡ This job is taken</span>
                                <p style="color: var(--text-light); margin-top: 8px; font-size: 0.875rem;">You marked this job as taken.</p>
                            </div>
                        `;
                    }
                } else {
                    // Non-owner only sees status text
                    if (job.status === 'Taken') {
                        statusSection = `
                            <div style="margin-bottom: 16px;">
                                <span style="color: var(--warning); font-weight: 600; font-size: 1.1rem;">⚡ This job has been taken</span>
                            </div>
                        `;
                    }
                }
                
                // Contact section - show client contact info prominently
                let contactSection = '';
                if (job.status === 'Open') {
                    if (p.phone) {
                        contactSection = `
                            <div class="client-contact-box">
                                <p style="color: var(--text-light); margin-bottom: 8px;">📞 Contact the client about this job:</p>
                                <p class="phone-display">📱 ${p.phone}</p>
                                <div class="contact-buttons">
                                    <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                                    <a href="${callLink}" class="btn-primary">📞 Call Now</a>
                                </div>
                            </div>
                        `;
                    } else {
                        contactSection = `
                            <p style="color: var(--text-light);">This client has not provided a phone number. You may still contact them through the platform.</p>
                        `;
                    }
                } else {
                    contactSection = `
                        <p>This job is no longer accepting new applications.</p>
                    `;
                }
                
                container.innerHTML = `
                    <div class="job-detail-header">
                        <div>
                            <span class="badge" style="background: ${statusColor};">${job.status}</span>
                            <h1>${job.title}</h1>
                            <p class="job-detail-category">${job.category || 'General'}</p>
                            <div class="job-meta">
                                <span>📍 ${job.location || 'Buea'}</span>
                                <span>💰 ${job.budget || 'Not specified'}</span>
                                <span>📅 Posted ${postedDate}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="job-description">
                        <h3>Job Description</h3>
                        <p>${job.description}</p>
                    </div>
                    
                    <div class="client-info">
                        <h3>Client Information</h3>
                        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
                            <img src="${p.avatar_url || 'https://via.placeholder.com/60'}" class="client-avatar-small" alt="${p.full_name || 'Client'}">
                            <div>
                                <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">${p.full_name || 'Anonymous'}</p>
                                <p style="color: var(--text-light); font-size: 0.9rem;">📍 ${p.location || 'Buea'}</p>
                            </div>
                        </div>
                        ${contactSection}
                    </div>
                    
                    <div class="apply-section">
                        <h3>Job Status</h3>
                        ${statusSection}
                        <p style="color: var(--text-light); font-size: 0.875rem; margin-top: 12px;">
                            💡 <strong>Tip:</strong> Always discuss details, pricing, and timing before starting any work.
                        </p>
                    </div>
                `;
                
            } catch (err) {
                console.error('Job load error:', err);
                container.innerHTML = '<p class="error">Error loading job. Please try again.</p>';
            }
        }
        
        async function updateStatus(newStatus) {
            if (!supabaseClient || !currentJobId) return;
            
            const { error } = await supabaseClient
                .from('job_posts')
                .update({ status: newStatus })
                .eq('id', currentJobId);
            
            if (error) {
                alert('Error updating status: ' + error.message);
                return;
            }
            
            window.location.reload();
        }
    </script>
</body>
</html>
