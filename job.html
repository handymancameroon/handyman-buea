<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .client-contact-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .client-contact-box p { margin-bottom: 12px; font-size: 1rem; }
        .client-contact-box .phone-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .client-avatar-small {
            width: 60px; height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .contact-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .contact-buttons a { flex: 1; min-width: 140px; text-align: center; }
        
        .status-badge-large {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-available-large {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #86efac;
        }
        .status-closed-large {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="job-detail-page">
        <div class="container" id="jobContainer">
            <p class="loading">Loading job...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        let currentJob = null;
        let currentJobId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => {
                await loadJobDetail();
            }, 100);
        });
        
        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('jobContainer');
            currentJobId = id;
            
            if (!id) {
                container.innerHTML = '<p class="error">Job not found.</p>';
                return;
            }
            
            if (!supabaseClient) {
                container.innerHTML = '<p class="error">Cannot connect to database.</p>';
                return;
            }
            
            try {
                const { data: job, error } = await supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name, phone, avatar_url, location)')
                    .eq('id', id)
                    .single();
                
                if (error || !job) {
                    container.innerHTML = '<p class="error">Job not found.</p>';
                    return;
                }
                
                currentJob = job;
                const p = job.profiles || {};
                const phoneNum = (p.phone || '').replace(/\D/g, '');
                const whatsappLink = phoneNum ? `https://wa.me/237${phoneNum}` : '#';
                const callLink = p.phone ? `tel:${p.phone}` : '#';
                const postedDate = new Date(job.created_at).toLocaleDateString('en-GB');
                
                // Check if current user is the job owner
                const { data: { user } } = await supabaseClient.auth.getUser();
                const isOwner = user && user.id === job.client_id;
                
                // Determine status display
                const isAvailable = job.status === 'Open';
                const statusBadgeClass = isAvailable ? 'status-available-large' : 'status-closed-large';
                const statusText = isAvailable ? '✅ Available' : '🔒 Closed';
                
                // Owner notice
                let ownerNotice = '';
                if (isOwner && isAvailable) {
                    ownerNotice = `
                        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;">
                            <p style="color: #1e40af; font-size: 0.9rem; margin: 0;">
                                💡 <strong>This is your job.</strong> You can close it from your <a href="dashboard.html" style="color: var(--primary); font-weight: 600;">Dashboard</a>.
                            </p>
                        </div>
                    `;
                }
                
                // Contact section
                let contactSection = '';
                if (isAvailable) {
                    if (p.phone) {
                        contactSection = `
                            <div class="client-contact-box">
                                <p style="color: var(--text-light); margin-bottom: 8px;">📞 Contact the client about this job:</p>
                                <p class="phone-display">📱 ${p.phone}</p>
                                <div class="contact-buttons">
                                    <a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                                    <a href="${callLink}" class="btn-primary">📞 Call Now</a>
                                </div>
                            </div>
                        `;
                    } else {
                        contactSection = `<p style="color: var(--text-light);">This client has not provided a phone number.</p>`;
                    }
                } else {
                    contactSection = `<p style="color: var(--text-light);">This job is closed and no longer accepting applications.</p>`;
                }
                
                container.innerHTML = `
                    <div class="job-detail-header">
                        <div style="width: 100%;">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px;">
                                <span class="status-badge-large ${statusBadgeClass}">${statusText}</span>
                                <span style="color: var(--text-light); font-size: 0.875rem;">📅 Posted ${postedDate}</span>
                            </div>
                            <h1>${job.title}</h1>
                            <p class="job-detail-category">${job.category || 'General'}</p>
                            <div class="job-meta">
                                <span>📍 ${job.location || 'Buea'}</span>
                                <span>💰 ${job.budget || 'Not specified'}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${ownerNotice}
                    
                    <div class="job-description">
                        <h3>Job Description</h3>
                        <p>${job.description}</p>
                    </div>
                    
                    <div class="client-info">
                        <h3>Client Information</h3>
                        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
                            <img src="${p.avatar_url || 'https://via.placeholder.com/60'}" class="client-avatar-small" alt="${p.full_name || 'Client'}">
                            <div>
                                <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 4px;">${p.full_name || 'Anonymous'}</p>
                                <p style="color: var(--text-light); font-size: 0.9rem;">📍 ${p.location || 'Buea'}</p>
                            </div>
                        </div>
                        ${contactSection}
                    </div>
                    
                    <div class="apply-section">
                        <h3>💡 Tips for Workers</h3>
                        <p style="color: var(--text-light); font-size: 0.9rem; line-height: 1.6;">
                            • Always confirm details, pricing, and timing before starting.<br>
                            • Ask for the client's exact location in Buea.<br>
                            • Discuss payment method (cash, Mobile Money) upfront.<br>
                            • Be professional and arrive on time.
                        </p>
                    </div>
                `;
                
            } catch (err) {
                console.error('Job load error:', err);
                container.innerHTML = '<p class="error">Error loading job. Please try again.</p>';
            }
        }
    </script>
</body>
</html>
