<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Job Details - HandyMan</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="jobs.html">Back to Jobs</a></nav>
<div class="container" id="jobContainer" style="background:white;padding:20px;border-radius:12px;">Loading...</div>
<script>
async function loadJob(){ const id=new URLSearchParams(window.location.search).get('id'); const {data:j}=await supabaseClient.from('jobs').select('*').eq('id',id).single(); if(!j){document.getElementById('jobContainer').innerHTML='Not found';return;} document.getElementById('jobContainer').innerHTML=`<h1>${j.title}</h1><p><b>Category:</b> ${j.category} | <b>Town:</b> ${j.town} | <b>Budget:</b> ${j.budget}</p><p>${j.description}</p><p><b>Contact:</b> <a href="tel:${j.phone}">${j.phone}</a> | <a href="https://wa.me/${j.phone}" target="_blank">WhatsApp</a></p>`; }
loadJob();
</script><script src="app.js"></script></body></html>
