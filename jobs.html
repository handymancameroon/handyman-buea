<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs in Cameroon - Handy Man</title>
    <meta name="description" content="Browse open jobs across Cameroon. Find work as a plumber, electrician, cleaner, nanny, house help and more on Handy Man.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://handyman-buea.vercel.app/jobs.html">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="login.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        </div>
    </header>

    <main class="jobs-page">
        <div class="container">
            <h1 data-i18n="jobs_title">Find Jobs in Cameroon</h1>
            <div class="jobs-filters">
                <input type="text" id="searchQuery" data-i18n-placeholder="jobs_placeholder" placeholder="Search jobs or town...">
                <select id="categoryFilter">
                    <option value="" data-i18n="all_categories">All Categories</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Painting">Painting</option>
                    <option value="Masonry">Masonry</option>
                    <option value="Auto Mechanics">Auto Mechanics</option>
                    <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                    <option value="Hairdressing">Hairdressing</option>
                    <option value="Catering">Catering</option>
                    <option value="Nanny">Nanny</option>
                    <option value="House help">House help</option>
                    <option value="General Labour">General Labour</option>
                    <option value="Laundry services">Laundry services</option>
                    <option value="Transporter">Transporter</option>
                    <option value="Errands">Errands</option>
                    <option value="Construction Engineer">Construction Engineer</option>
                    <option value="Teacher/Tutors">Teacher/Tutors</option>
                    <option value="Lawyer">Lawyer</option>
                    <option value="Family Doctors">Family Doctors</option>
                    <option value="Stay at Home Nurse">Stay at Home Nurse</option>
                    <option value="Security Guard">Security Guard</option>
                    <option value="Gardener">Gardener</option>
                    <option value="Others">Others</option>
                </select>
                <button type="button" onclick="performSearch()" class="btn-primary" data-i18n="search">Search</button>
            </div>
            <p id="othersHint" style="display:none;color:var(--text-light);font-size:0.9rem;margin:8px 0 12px;">
                Showing jobs in custom / other categories (skills not in the main list).
            </p>
            <div class="job-grid" id="jobsResults">
                <p class="loading" data-i18n="loading">Loading jobs...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        var STANDARD_CATEGORIES = [
            'Plumbing', 'Electrical', 'Carpentry', 'Cleaning', 'Painting', 'Masonry',
            'Auto Mechanics', 'Phone/Laptop Repair', 'Hairdressing', 'Catering',
            'Nanny', 'House help', 'General Labour', 'Laundry services', 'Transporter',
            'Errands', 'Construction Engineer', 'Teacher/Tutors', 'Lawyer',
            'Family Doctors', 'Stay at Home Nurse', 'Security Guard', 'Gardener'
        ];

        function isStandardCategory(cat) {
            if (!cat) return false;
            var c = String(cat).trim().toLowerCase();
            if (c === 'others' || c === 'other') return false;
            for (var i = 0; i < STANDARD_CATEGORIES.length; i++) {
                if (STANDARD_CATEGORIES[i].toLowerCase() === c) return true;
            }
            return false;
        }

        function isOthersCategory(cat) {
            if (!cat) return false;
            var c = String(cat).trim().toLowerCase();
            if (c === 'others' || c === 'other') return true;
            return !isStandardCategory(cat);
        }

        document.addEventListener('DOMContentLoaded', async function () {
            try {
                if (typeof checkAuth === 'function') await checkAuth();
                if (typeof applyLanguage === 'function') applyLanguage();

                /* Mobile menu is handled once in app.js (avoids double-toggle bug) */

                var params = new URLSearchParams(window.location.search);
                var cat = params.get('category');
                if (cat) {
                    var sel = document.getElementById('categoryFilter');
                    if (sel) {
                        var exists = false;
                        for (var i = 0; i < sel.options.length; i++) {
                            if (sel.options[i].value === cat) {
                                exists = true;
                                break;
                            }
                        }
                        if (exists) {
                            sel.value = cat;
                        } else if (isOthersCategory(cat)) {
                            sel.value = 'Others';
                        }
                    }
                }
                performSearch();
            } catch (err) {
                console.error(err);
            }
        });

        async function performSearch() {
            var queryEl = document.getElementById('searchQuery');
            var catEl = document.getElementById('categoryFilter');
            var container = document.getElementById('jobsResults');
            var hint = document.getElementById('othersHint');

            if (!container) return;

            var query = queryEl ? queryEl.value : '';
            var category = catEl ? catEl.value : '';

            container.innerHTML = '<p class="loading">' + (typeof t === 'function' ? t('loading') : 'Searching...') + '</p>';
            if (hint) hint.style.display = (category === 'Others') ? 'block' : 'none';

            if (typeof supabaseClient === 'undefined' || !supabaseClient) {
                container.innerHTML = '<p class="empty">Cannot load jobs. Please refresh.</p>';
                return;
            }

            try {
                var dbQuery = supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name)')
                    .eq('status', 'Open')
                    .order('created_at', { ascending: false });

                if (category && category !== 'Others') {
                    dbQuery = dbQuery.eq('category', category);
                }

                var result = await dbQuery;
                var jobs = result && result.data ? result.data : null;
                var error = result ? result.error : null;

                if (error) {
                    container.innerHTML = '<p class="error">' + (typeof t === 'function' ? t('error') : 'Error loading jobs.') + '</p>';
                    return;
                }

                var filtered = jobs || [];

                if (category === 'Others') {
                    var othersOnly = [];
                    for (var i = 0; i < filtered.length; i++) {
                        if (isOthersCategory(filtered[i].category)) othersOnly.push(filtered[i]);
                    }
                    filtered = othersOnly;
                }

                if (query) {
                    var q = query.toLowerCase();
                    var byQuery = [];
                    for (var j = 0; j < filtered.length; j++) {
                        var job = filtered[j];
                        if ((job.title || '').toLowerCase().indexOf(q) !== -1 ||
                            (job.description || '').toLowerCase().indexOf(q) !== -1 ||
                            (job.category || '').toLowerCase().indexOf(q) !== -1 ||
                            (job.location || '').toLowerCase().indexOf(q) !== -1) {
                            byQuery.push(job);
                        }
                    }
                    filtered = byQuery;
                }

                if (filtered.length === 0) {
                    container.innerHTML = '<p class="empty">' + (typeof t === 'function' ? t('no_jobs') : 'No jobs found.') +
                        ' <a href="post-job.html">' + (typeof t === 'function' ? t('nav_post') : 'Post a Job') + '</a></p>';
                    return;
                }

                renderJobs(filtered, container);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="error">' + (typeof t === 'function' ? t('error') : 'Error loading jobs.') + '</p>';
            }
        }

        function renderJobs(jobs, container) {
            var html = '';
            for (var i = 0; i < jobs.length; i++) {
                var j = jobs[i];
                var catLabel = (typeof getCategoryDisplayName === 'function')
                    ? getCategoryDisplayName(j.category || 'Others')
                    : (j.category || 'General');
                var poster = escapeHtml((j.profiles && j.profiles.full_name) ? j.profiles.full_name : 'Anonymous');
                html += '<div class="job-card" onclick="viewJob(\'' + j.id + '\')">' +
                    '<span class="job-status">' + (j.status || '') + '</span>' +
                    '<h3>' + escapeHtml(j.title || '') + '</h3>' +
                    '<p class="job-category">' + catLabel + '</p>' +
                    '<p class="job-location">📍 ' + escapeHtml(j.location || 'Cameroon') + '</p>' +
                    '<p class="job-budget">' + escapeHtml(j.budget || 'Budget not specified') + '</p>' +
                    '<p style="color: var(--text-light); font-size: 0.875rem;">Posted by ' + poster + '</p>' +
                    '<button class="btn-small" style="margin-top: 12px;">' +
                    (typeof t === 'function' ? t('view_job') : 'View Job') + '</button>' +
                    '</div>';
            }
            container.innerHTML = html;
        }
    </script>
</body>
</html>
