<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Jobs - HandyMan Cameroon - Jobs in Buea, Douala, Yaounde</title>
<meta name="description" content="Find jobs for plumbers, electricians, cleaners across Cameroon.">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="post-job.html" class="btn-small">Post Job</a></nav>
<div class="container">
<h1>Jobs in Cameroon - All Towns</h1>
<div class="search-filters">
<input type="text" id="searchJob" placeholder="Search job..." onkeyup="filterJobs()" style="flex:1;padding:10px;">
<select id="townFilter" onchange="filterJobs()"></select>
<select id="catFilter" onchange="filterJobs()"></select>
</div>
<div id="jobsList"></div>
</div>
<script>
let allJobs=[];
async function loadJobs(){
  const {data:jobs} = await supabaseClient.from('jobs').select('*').eq('status','open').order('created_at',{ascending:false});
  allJobs=jobs||[]; renderJobs(allJobs);
}
function renderJobs(jobs){
  document.getElementById('jobsList').innerHTML=jobs.map(j=>`<div style="background:white;padding:16px;margin:10px 0;border-radius:10px;border:1px solid #e2e8f0;"><h3>${j.title}</h3><p>${j.category} - ${j.town} - ${j.budget}</p><p>${j.description?.slice(0,120)}...</p><a href="job.html?id=${j.id}" class="btn-small">View Details</a></div>`).join('') || 'No jobs';
}
function filterJobs(){
  const q=document.getElementById('searchJob').value.toLowerCase(); const town=document.getElementById('townFilter').value; const cat=document.getElementById('catFilter').value;
  let f=allJobs.filter(j=> (!q||j.title.toLowerCase().includes(q)) && (!town||j.town===town) && (!cat||j.category===cat) );
  renderJobs(f);
}
window.addEventListener('load', ()=>{
  const tSel=document.getElementById('townFilter'); tSel.innerHTML='<option value="">All Towns</option>'; CAMEROON_TOWNS.forEach(t=>tSel.innerHTML+=`<option value="${t}">${t}</option>`);
  const cSel=document.getElementById('catFilter'); cSel.innerHTML='<option value="">All Categories</option>'; CATEGORIES.forEach(c=>cSel.innerHTML+=`<option value="${c}">${c}</option>`);
  loadJobs();
});
</script>
<script src="app.js"></script>
</body>
</html>
