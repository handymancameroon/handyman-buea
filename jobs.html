<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs in Cameroon - Handy Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="login.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="jobs-page">
        <div class="container">
            <h1 data-i18n="jobs_title">Find Jobs in Cameroon</h1>
            <div class="jobs-filters">
                <input type="text" id="searchQuery" data-i18n-placeholder="jobs_placeholder" placeholder="Search jobs or town...">
                <select id="categoryFilter">
                    <option value="" data-i18n="all_categories">All Categories</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Painting">Painting</option>
                    <option value="Masonry">Masonry</option>
                    <option value="Auto Mechanics">Auto Mechanics</option>
                    <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                    <option value="Hairdressing">Hairdressing</option>
                    <option value="Catering">Catering</option>
                    <option value="Others">Others</option>
                </select>
                <button onclick="performSearch()" class="btn-primary" data-i18n="search">Search</button>
            </div>
            <div class="job-grid" id="jobsResults">
                <p class="loading" data-i18n="loading">Loading...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('category');
            if (cat) document.getElementById('categoryFilter').value = cat;
            performSearch();
        });

        async function performSearch() {
            const query = document.getElementById('searchQuery').value;
            const category = document.getElementById('categoryFilter').value;
            const container = document.getElementById('jobsResults');

            container.innerHTML = '<p class="loading">' + t('searching') + '</p>';

            if (!supabaseClient) {
                container.innerHTML = '<p class="empty">' + t('error') + '</p>';
                return;
            }

            let dbQuery = supabaseClient
                .from('job_posts')
                .select('*, profiles(full_name)')
                .eq('status', 'Open')
                .order('created_at', { ascending: false });

            if (category) dbQuery = dbQuery.eq('category', category);

            const { data: jobs, error } = await dbQuery;

            if (error) {
                container.innerHTML = '<p class="error">' + t('error') + '</p>';
                return;
            }

            let filtered = jobs || [];
            if (query) {
                const q = query.toLowerCase();
                filtered = filtered.filter(j =>
                    (j.title || '').toLowerCase().includes(q) ||
                    (j.description || '').toLowerCase().includes(q) ||
                    (j.category || '').toLowerCase().includes(q) ||
                    (j.location || '').toLowerCase().includes(q)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty">' + t('no_jobs') + '</p>';
                return;
            }

            container.innerHTML = filtered.map(j => `
                <div class="job-card" onclick="viewJob('${j.id}')">
                    <span class="job-status">${j.status}</span>
                    <h3>${j.title}</h3>
                    <p class="job-category">${j.category || 'General'}</p>
                    <p class="job-location">📍 ${j.location || 'Cameroon'}</p>
                    <p class="job-budget">${j.budget || t('budget_not_specified')}</p>
                    <p style="color: var(--text-light); font-size: 0.875rem;">${t('posted_by')} ${j.profiles?.full_name || 'Anonymous'}</p>
                    <button class="btn-small" style="margin-top: 12px;">${t('view_job')}</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
