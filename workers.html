<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers - Handy Man Cameroon</title>
    <meta name="description" content="Find trusted plumbers, electricians, cleaners, carpenters and skilled workers across Cameroon. Search by category and town.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="search-page">
        <div class="container">
            <h1>Find Workers in Cameroon</h1>

            <div class="search-filters">
                <input type="text" id="searchQuery" placeholder="Search by name, skill or town...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <select id="townFilter">
                    <option value="">All Towns</option>
                </select>
                <button class="btn-primary" onclick="searchWorkers()">Search</button>
            </div>

            <div class="worker-grid" id="workerResults">
                <p class="loading">Loading workers...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Handy Man. Connecting people with skilled workers across Cameroon.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            await checkAuth();
            await populateFilters();
            await searchWorkers();
        });

        async function populateFilters() {
            var catSelect = document.getElementById('categoryFilter');
            var townSelect = document.getElementById('townFilter');

            // Categories
            if (typeof FALLBACK_CATEGORIES !== 'undefined') {
                FALLBACK_CATEGORIES.forEach(function (c) {
                    var opt = document.createElement('option');
                    opt.value = c.name;
                    opt.textContent = c.name;
                    catSelect.appendChild(opt);
                });
            }

            // Towns
            var towns = ['Buea','Limbe','Douala','Yaoundé','Bamenda','Bafoussam','Kribi','Garoua','Maroua','Ngaoundéré','Bertoua','Ebolowa','Kumba','Dschang','Nkongsamba','Edéa','Mutengene','Tiko','Other'];
            towns.forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                townSelect.appendChild(opt);
            });

            // Pre-select category from URL
            var params = new URLSearchParams(window.location.search);
            if (params.get('category')) {
                catSelect.value = params.get('category');
            }
        }

        async function searchWorkers() {
            var container = document.getElementById('workerResults');
            container.innerHTML = '<p class="loading">Loading workers...</p>';

            var query = (document.getElementById('searchQuery').value || '').trim().toLowerCase();
            var category = document.getElementById('categoryFilter').value;
            var town = document.getElementById('townFilter').value;

            try {
                var q = supabaseClient
                    .from('worker_details')
                    .select('*, profiles!inner(full_name, avatar_url, location, phone, is_worker)')
                    .eq('profiles.is_worker', true)
                    .order('rating', { ascending: false })
                    .limit(80);

                if (category) {
                    q = q.eq('category', category);
                }

                var result = await q;
                var data = result.data || [];
                var error = result.error;

                if (error) {
                    console.error(error);
                    container.innerHTML = '<p class="empty-dashboard">No workers found. Try a different search.</p>';
                    return;
                }

                // Client-side filters
                if (town) {
                    data = data.filter(function (w) {
                        return (w.profiles && w.profiles.location || '').toLowerCase().indexOf(town.toLowerCase()) !== -1;
                    });
                }
                if (query) {
                    data = data.filter(function (w) {
                        var name = (w.profiles && w.profiles.full_name || '').toLowerCase();
                        var cat = (w.category || '').toLowerCase();
                        var loc = (w.profiles && w.profiles.location || '').toLowerCase();
                        var desc = (w.description || '').toLowerCase();
                        return name.indexOf(query) !== -1 || cat.indexOf(query) !== -1 || loc.indexOf(query) !== -1 || desc.indexOf(query) !== -1;
                    });
                }

                if (data.length === 0) {
                    container.innerHTML = '<p class="empty-dashboard">No workers found. Try a different search.</p>';
                    return;
                }

                var html = '';
                data.forEach(function (w) {
                    var p = w.profiles || {};
                    var rating = Number(w.rating || 0).toFixed(1);
                    var reviews = w.review_count || 0;
                    var avatar = p.avatar_url || 'https://via.placeholder.com/120?text=Worker';
                    var name = p.full_name || 'Worker';
                    var location = p.location || 'Cameroon';

                    html += '<div class="worker-card">' +
                        '<img src="' + avatar + '" alt="' + name + '" class="worker-avatar" onerror="this.src=\'https://via.placeholder.com/120?text=Worker\'">' +
                        '<div class="worker-info">' +
                            '<h3>' + name + '</h3>' +
                            '<p class="worker-category">' + (w.category || 'General') + '</p>' +
                            '<p class="worker-location">📍 ' + location + '</p>' +
                            '<p class="worker-rating">⭐ ' + rating + '/5 (' + reviews + ' reviews)</p>' +
                            '<a href="worker.html?id=' + w.id + '" class="btn-primary">View Profile</a>' +
                        '</div>' +
                    '</div>';
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="empty-dashboard">No workers found. Try a different search.</p>';
            }
        }

        window.searchWorkers = searchWorkers;
    </script>
</body>
</html>
