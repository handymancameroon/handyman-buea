<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers - Handy Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="search-page">
        <div class="container">
            <h1>Find Workers in Cameroon</h1>
            <div class="search-filters">
                <input type="text" id="searchQuery" placeholder="Search by name or skill...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Painting">Painting</option>
                    <option value="Masonry">Masonry</option>
                    <option value="Auto Mechanics">Auto Mechanics</option>
                    <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                    <option value="Hairdressing">Hairdressing</option>
                    <option value="Catering">Catering</option>
                    <option value="Others">Others</option>
                </select>
                <button onclick="performSearch()" class="btn-primary">Search</button>
            </div>
            <div class="worker-grid" id="searchResults">
                <p class="loading">Loading workers...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            performSearch();
            var q = document.getElementById('searchQuery');
            if (q) {
                q.addEventListener('keyup', function (e) {
                    if (e.key === 'Enter') performSearch();
                });
            }
        });

        async function performSearch() {
            const container = document.getElementById('searchResults');
            const queryText = (document.getElementById('searchQuery').value || '').toLowerCase().trim();
            const category = document.getElementById('categoryFilter').value;

            container.innerHTML = '<p class="loading">Searching...</p>';

            if (!supabaseClient) {
                container.innerHTML = '<p class="empty">Cannot load workers. Please refresh.</p>';
                return;
            }

            let dbQuery = supabaseClient
                .from('worker_details')
                .select('*, profiles(full_name, avatar_url, location, phone, is_deleted)')
                .eq('availability', 'Available');

            if (category) {
                dbQuery = dbQuery.eq('category', category);
            }

            const { data: workers, error } = await dbQuery;

            if (error) {
                container.innerHTML = '<p class="error">Error loading workers: ' + error.message + '</p>';
                return;
            }

            // Hide soft-deleted accounts
            let list = (workers || []).filter(function (w) {
                return !(w.profiles && w.profiles.is_deleted === true);
            });

            if (queryText) {
                list = list.filter(function (w) {
                    const name = ((w.profiles && w.profiles.full_name) || '').toLowerCase();
                    const cat = (w.category || '').toLowerCase();
                    const desc = (w.description || '').toLowerCase();
                    const loc = ((w.profiles && w.profiles.location) || '').toLowerCase();
                    return name.indexOf(queryText) !== -1 ||
                        cat.indexOf(queryText) !== -1 ||
                        desc.indexOf(queryText) !== -1 ||
                        loc.indexOf(queryText) !== -1;
                });
            }

            if (!list.length) {
                container.innerHTML = '<p class="empty">No workers found. Try another search.</p>';
                return;
            }

            if (typeof renderWorkers === 'function') {
                renderWorkers(list, container);
            } else {
                container.innerHTML = list.map(function (w) {
                    const p = w.profiles || {};
                    return '<div class="worker-card">' +
                        '<img src="' + (p.avatar_url || 'https://via.placeholder.com/80') + '" alt="">' +
                        '<h3>' + (p.full_name || 'Worker') + '</h3>' +
                        '<p>' + (w.category || '') + ' • ' + (p.location || 'Cameroon') + '</p>' +
                        '<a href="worker.html?id=' + w.id + '" class="btn-primary">View Profile</a></div>';
                }).join('');
            }
        }
    </script>
</body>
</html>
