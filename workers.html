<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers - Handy Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="search-page">
        <div class="container">
            <h1>Find Workers in Buea</h1>
            <div class="search-filters">
                <input type="text" id="searchQuery" placeholder="Search by name or skill...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Carpentry">Carpentry</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Painting">Painting</option>
                    <option value="Masonry">Masonry</option>
                    <option value="Auto Mechanics">Auto Mechanics</option>
                    <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                    <option value="Hairdressing">Hairdressing</option>
                    <option value="Catering">Catering</option>
                    <option value="Others">Others</option>
                </select>
                <button onclick="performSearch()" class="btn-primary">Search</button>
            </div>
            <div class="worker-grid" id="searchResults">
                <p class="loading">Loading workers...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Wait briefly if supabaseClient is still initializing
            if (!supabaseClient) {
                await new Promise(r => setTimeout(r, 300));
            }
            await checkAuth();

            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            const cat = params.get('category');
            if (q) document.getElementById('searchQuery').value = q;
            if (cat) document.getElementById('categoryFilter').value = cat;

            performSearch();
        });

        async function performSearch() {
            const query = document.getElementById('searchQuery').value;
            const category = document.getElementById('categoryFilter').value;
            const container = document.getElementById('searchResults');

            container.innerHTML = '<p class="loading">Searching...</p>';

            if (!supabaseClient) {
                container.innerHTML = '<p class="empty">Cannot load workers. Please refresh the page.</p>';
                return;
            }

            try {
                let dbQuery = supabaseClient
                    .from('worker_details')
                    .select('*, profiles(full_name, avatar_url, location, phone)')
                    .eq('availability', 'Available');

                if (category) {
                    dbQuery = dbQuery.eq('category', category);
                }

                const { data: workers, error } = await dbQuery;

                if (error) {
                    console.error(error);
                    container.innerHTML = '<p class="error">Error loading workers. Please try again.</p>';
                    return;
                }

                let filtered = workers || [];
                if (query) {
                    const q = query.toLowerCase();
                    filtered = filtered.filter(w =>
                        (w.profiles?.full_name || '').toLowerCase().includes(q) ||
                        (w.category || '').toLowerCase().includes(q) ||
                        (w.description || '').toLowerCase().includes(q)
                    );
                }

                if (filtered.length === 0) {
                    container.innerHTML = '<p class="empty">No workers found. Try a different search.</p>';
                    return;
                }

                renderWorkers(filtered, container);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="error">Something went wrong. Please refresh.</p>';
            }
        }
    </script>
</body>
</html>
