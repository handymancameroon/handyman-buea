<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as Worker - Handy Man Cameroon</title>
    <meta name="description" content="Create your worker profile on Handy Man and start receiving jobs anywhere in Cameroon.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="workers.html" data-i18n="nav_workers">Find Workers</a>
                <a href="jobs.html" data-i18n="nav_jobs">Find Jobs</a>
                <a href="join.html" class="btn-secondary" data-i18n="nav_join">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary" data-i18n="nav_post">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn" data-i18n="nav_login">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <h2>Join as a Service Provider</h2>
                <p>Create your worker profile to receive jobs anywhere in Cameroon.</p>

                <form id="workerForm" onsubmit="handleWorkerJoin(event)">
                    <div class="form-group">
                        <label>Town where you work *</label>
                        <select id="wTown" required>
                            <option value="">Select town</option>
                            <option value="Buea">Buea</option>
                            <option value="Limbe">Limbe</option>
                            <option value="Douala">Douala</option>
                            <option value="Yaoundé">Yaoundé</option>
                            <option value="Bamenda">Bamenda</option>
                            <option value="Bafoussam">Bafoussam</option>
                            <option value="Kribi">Kribi</option>
                            <option value="Garoua">Garoua</option>
                            <option value="Maroua">Maroua</option>
                            <option value="Ngaoundéré">Ngaoundéré</option>
                            <option value="Bertoua">Bertoua</option>
                            <option value="Ebolowa">Ebolowa</option>
                            <option value="Kumba">Kumba</option>
                            <option value="Dschang">Dschang</option>
                            <option value="Nkongsamba">Nkongsamba</option>
                            <option value="Edéa">Edéa</option>
                            <option value="Mutengene">Mutengene</option>
                            <option value="Tiko">Tiko</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Service Category *</label>
                        <select id="wCategory" required>
                            <option value="">Select your main skill</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Carpentry">Carpentry</option>
                            <option value="Cleaning">Cleaning</option>
                            <option value="Painting">Painting</option>
                            <option value="Masonry">Masonry</option>
                            <option value="Auto Mechanics">Auto Mechanics</option>
                            <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                            <option value="Hairdressing">Hairdressing</option>
                            <option value="Catering">Catering</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description of Services *</label>
                        <textarea id="wDescription" required rows="4" placeholder="Describe what you do, your skills, and experience..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" id="wExperience" min="0" value="0">
                    </div>

                    <div class="form-group">
                        <label>Phone for Calls</label>
                        <input type="tel" id="wPhone" placeholder="6XX XXX XXX">
                    </div>

                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="wWhatsapp" placeholder="6XX XXX XXX">
                    </div>

                    <div class="form-group">
                        <label>Profile Photo (optional)</label>
                        <input type="file" id="wAvatar" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>Portfolio Photos (up to 2, optional)</label>
                        <input type="file" id="wPortfolio" accept="image/*" multiple>
                    </div>

                    <button type="submit" class="btn-primary full">Create Profile</button>
                </form>

                <p id="joinMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            await checkAuth();
            applyLanguage();

            // Not logged in → go to login, then come back here
            if (!currentUser) {
                window.location.href = 'login.html?redirect=join';
                return;
            }

            var menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    var n = document.getElementById('nav');
                    if (n) n.classList.toggle('active');
                });
            }
        });

        async function handleWorkerJoin(e) {
            e.preventDefault();
            showJoinMessage('Creating profile...', '');

            try {
                if (!supabaseClient || !currentUser) {
                    showJoinMessage('Please login first.', 'error');
                    return;
                }

                var userId = currentUser.id;
                var town = document.getElementById('wTown').value;
                var category = document.getElementById('wCategory').value;
                var description = document.getElementById('wDescription').value.trim();
                var experience = parseInt(document.getElementById('wExperience').value) || 0;
                var phone = document.getElementById('wPhone').value.trim();
                var whatsapp = document.getElementById('wWhatsapp').value.trim();

                if (!town || !category || !description) {
                    showJoinMessage('Please fill all required fields.', 'error');
                    return;
                }

                await supabaseClient.from('profiles').update({
                    location: town,
                    is_worker: true
                }).eq('id', userId);

                var avatarFile = document.getElementById('wAvatar').files[0];
                if (avatarFile) {
                    var avatarUrl = await uploadFile(avatarFile, 'avatars', userId);
                    if (avatarUrl) {
                        await supabaseClient.from('profiles').update({ avatar_url: avatarUrl }).eq('id', userId);
                    }
                }

                var portfolioUrls = [];
                var portfolioFiles = document.getElementById('wPortfolio').files;
                if (portfolioFiles && portfolioFiles.length > 0) {
                    portfolioUrls = await uploadMultipleFiles(portfolioFiles, 'portfolio', userId, 2);
                }

                var details = {
                    id: userId,
                    category: category,
                    description: description,
                    experience_years: experience,
                    contact_phone: phone || null,
                    whatsapp_number: whatsapp || null,
                    availability: 'Available',
                    rating: 0,
                    review_count: 0,
                    portfolio: portfolioUrls.length > 0 ? portfolioUrls : null
                };

                var { error } = await supabaseClient
                    .from('worker_details')
                    .upsert([details], { onConflict: 'id' });

                if (error) {
                    showJoinMessage('Error: ' + error.message, 'error');
                } else {
                    showJoinMessage('Profile created successfully! Redirecting...', 'success');
                    setTimeout(function () {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
            } catch (err) {
                console.error(err);
                showJoinMessage('Something went wrong. Please try again.', 'error');
            }
        }

        function showJoinMessage(msg, type) {
            var el = document.getElementById('joinMessage');
            el.textContent = msg;
            el.className = 'message ' + (type || '');
        }
    </script>
</body>
</html>
