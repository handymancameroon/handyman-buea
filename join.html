<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join as Worker - HandyMan Cameroon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="workers.html">Find Workers</a></nav>

<div class="container" style="max-width:500px;background:white;padding:24px;border-radius:12px;margin:30px auto;">
<h2>Join as Worker - Cameroon</h2>
<p>All towns: Buea, Limbe, Douala, Yaounde, Bamenda, etc.</p>

<input type="text" id="fullName" placeholder="Full Name" style="width:100%;padding:10px;margin:8px 0;" required>
<input type="email" id="email" placeholder="Email" style="width:100%;padding:10px;margin:8px 0;" required>
<input type="tel" id="phone" placeholder="Phone (e.g. 6XXXXXXXX)" style="width:100%;padding:10px;margin:8px 0;" required>
<input type="tel" id="whatsapp" placeholder="WhatsApp (optional)" style="width:100%;padding:10px;margin:8px 0;">
<select id="town" style="width:100%;padding:10px;margin:8px 0;"></select>
<select id="category" style="width:100%;padding:10px;margin:8px 0;"></select>

<div style="position:relative;">
<input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;margin:8px 0;" required>
<button type="button" onclick="togglePassword('password')" style="position:absolute;right:8px;top:14px;">👁️</button>
</div>
<div style="position:relative;">
<input type="password" id="confirmPassword" placeholder="Confirm Password - Review Password" style="width:100%;padding:10px;margin:8px 0;" required>
<button type="button" onclick="togglePassword('confirmPassword')" style="position:absolute;right:8px;top:14px;">👁️</button>
</div>

<textarea id="bio" placeholder="Bio / Skills" style="width:100%;padding:10px;margin:8px 0;"></textarea>
<label>Profile Photo:</label><input type="file" id="photo" accept="image/*" style="margin:8px 0;">

<button onclick="register()" class="btn uniform-btn" style="width:100%;">Join Now</button>
<p id="status" style="margin-top:12px;"></p>
<p>Already have account? <a href="login.html">Login</a></p>
</div>

<script>
window.addEventListener('load', function(){
  const townSel=document.getElementById('town'); CAMEROON_TOWNS.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; townSel.appendChild(o); });
  const catSel=document.getElementById('category'); CATEGORIES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });
});
function togglePassword(id){ const inp=document.getElementById(id); inp.type = inp.type==='password'? 'text':'password'; }

async function register(){
  const fullName=document.getElementById('fullName').value; const email=document.getElementById('email').value; const phone=document.getElementById('phone').value;
  const whatsapp=document.getElementById('whatsapp').value||phone; const town=document.getElementById('town').value; const category=document.getElementById('category').value;
  const password=document.getElementById('password').value; const confirm=document.getElementById('confirmPassword').value; const bio=document.getElementById('bio').value;
  if(!fullName||!email||!phone||!password){ document.getElementById('status').innerText='All required fields needed'; return; }
  if(password!==confirm){ document.getElementById('status').innerText='Passwords do not match - please review password'; return; }
  document.getElementById('status').innerText='Registering...';
  const {data, error} = await supabaseClient.auth.signUp({email:email, password:password});
  if(error){ document.getElementById('status').innerText='Error: '+error.message; return; }
  const userId=data.user?.id || data.user?.id;
  if(userId){
    let photoUrl=null; const file=document.getElementById('photo').files[0]; if(file){ photoUrl = await uploadFile(file, 'avatars', userId); }
    await supabaseClient.from('profiles').insert({id:userId, full_name:fullName, email:email, phone:phone, whatsapp:whatsapp, town:town, category:category, bio:bio, photo_url:photoUrl, avatar_url:photoUrl, is_worker:true, average_rating:0, total_reviews:0});
  }
  document.getElementById('status').innerText='Success! Check email to confirm, then login.';
  setTimeout(()=> location.href='login.html', 2000);
}
</script>
<script src="app.js"></script>
</body>
</html>
