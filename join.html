<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as Worker - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .photo-upload-box {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: #f8fafc;
        }
        .photo-upload-box input[type="file"] {
            width: 100%;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .avatar-preview {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin: 12px auto 0;
            display: none;
            border: 3px solid var(--primary);
        }
        .avatar-preview.show { display: block; }
        .file-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            justify-content: center;
        }
        .file-preview-item {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border);
        }
        .upload-hint {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-top: 6px;
            display: block;
        }
        .auth-box { max-width: 520px; }
        .custom-category-field { display: none; margin-top: 8px; }
        .custom-category-field.active { display: block; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="dashboard.html" class="btn-secondary">My Jobs</a>
                <a href="login.html" class="btn-primary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <h2>Join as a Service Provider</h2>
                <p style="color: var(--text-light); margin-bottom: 24px;">
                    Create your worker profile to appear in search and start receiving requests.
                </p>

                <form id="workerForm" onsubmit="handleWorkerJoin(event)">
                    <div class="form-group">
                        <label>Service Category *</label>
                        <select id="wCategory" required onchange="handleCategoryChange()">
                            <option value="">Select your main skill</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Carpentry">Carpentry</option>
                            <option value="Cleaning">Cleaning</option>
                            <option value="Painting">Painting</option>
                            <option value="Masonry">Masonry</option>
                            <option value="Auto Mechanics">Auto Mechanics</option>
                            <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                            <option value="Hairdressing">Hairdressing</option>
                            <option value="Catering">Catering</option>
                            <option value="Others">Others (specify below)</option>
                        </select>
                        <div id="customCategoryField" class="custom-category-field">
                            <input type="text" id="customCategory" placeholder="Enter your skill or category">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description of Services *</label>
                        <textarea id="wDescription" required rows="4" placeholder="Describe what you do, your skills, and experience..."></textarea>
                    </div
