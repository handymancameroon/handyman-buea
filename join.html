<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as Worker - Handy Man</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="login.html" class="btn-secondary">Join as Worker</a>
                <a href="post-job.html" class="btn-secondary">Post a Job</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-box">
                <h2>Join as a Service Provider</h2>
                <p>Create your worker profile to receive jobs anywhere in Cameroon.</p>

                <form id="workerForm" onsubmit="handleWorkerJoin(event)">
                    <div class="form-group">
                        <label>Town where you work *</label>
                        <select id="wTown" required>
                            <option value="">Select town</option>
                            <option value="Buea">Buea</option>
                            <option value="Limbe">Limbe</option>
                            <option value="Douala">Douala</option>
                            <option value="Yaoundé">Yaoundé</option>
                            <option value="Bamenda">Bamenda</option>
                            <option value="Bafoussam">Bafoussam</option>
                            <option value="Kribi">Kribi</option>
                            <option value="Garoua">Garoua</option>
                            <option value="Maroua">Maroua</option>
                            <option value="Ngaoundéré">Ngaoundéré</option>
                            <option value="Bertoua">Bertoua</option>
                            <option value="Ebolowa">Ebolowa</option>
                            <option value="Kumba">Kumba</option>
                            <option value="Dschang">Dschang</option>
                            <option value="Nkongsamba">Nkongsamba</option>
                            <option value="Edéa">Edéa</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Service Category *</label>
                        <select id="wCategory" required>
                            <option value="">Select your main skill</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Carpentry">Carpentry</option>
                            <option value="Cleaning">Cleaning</option>
                            <option value="Painting">Painting</option>
                            <option value="Masonry">Masonry</option>
                            <option value="Auto Mechanics">Auto Mechanics</option>
                            <option value="Phone/Laptop Repair">Phone/Laptop Repair</option>
                            <option value="Hairdressing">Hairdressing</option>
                            <option value="Catering">Catering</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description of Services *</label>
                        <textarea id="wDescription" required rows="4" placeholder="Describe what you do, your skills, and experience..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" id="wExperience" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>Phone for Calls</label>
                        <input type="tel" id="wPhone" placeholder="6XX XXX XXX">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="wWhatsapp" placeholder="6XX XXX XXX">
                    </div>
                    <button type="submit" class="btn-primary full">Create Profile</button>
                </form>

                <p id="joinMessage" class="message"></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
        });

        async function handleWorkerJoin(e) {
            e.preventDefault();

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                showJoinMessage('Please login first.', 'error');
                return;
            }

            const town = document.getElementById('wTown').value;
            if (town) {
                await supabaseClient.from('profiles').update({ location: town, is_worker: true }).eq('id', user.id);
            }

            const details = {
                id: user.id,
                category: document.getElementById('wCategory').value,
                description: document.getElementById('wDescription').value,
                experience_years: parseInt(document.getElementById('wExperience').value) || 0,
                contact_phone: document.getElementById('wPhone').value,
                whatsapp_number: document.getElementById('wWhatsapp').value,
                availability: 'Available'
            };

            const { error } = await supabaseClient.from('worker_details').upsert([details], { onConflict: 'id' });

            if (error) {
                showJoinMessage('Error: ' + error.message, 'error');
            } else {
                showJoinMessage('Profile created successfully! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        }

        function showJoinMessage(msg, type) {
            const el = document.getElementById('joinMessage');
            el.textContent = msg;
            el.className = 'message ' + type;
        }
    </script>
</body>
</html>
