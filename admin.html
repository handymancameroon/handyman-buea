<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Handy Man</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .admin-filter-bar select, .admin-filter-bar input { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
        .user-row, .dispute-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: #fff; flex-wrap: wrap; }
        .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-whatsapp { background: #25D366; color: white; border: none; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; cursor: pointer; }
        .btn-call { background: #0ea5e9; color: white; border: none; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
        .broadcast-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
        .broadcast-box textarea { width: 100%; min-height: 100px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin: 10px 0; }
        .stat-card.today { border-left: 4px solid #22c55e; }
        .deleted-user { opacity: 0.65; background: #fef2f2 !important; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">🔧 Handy Man</a>
            <nav class="nav" id="nav">
                <a href="index.html">Home</a>
                <a href="workers.html">Find Workers</a>
                <a href="jobs.html">Find Jobs</a>
                <a href="dashboard.html" class="btn-secondary">My Jobs</a>
                <a href="login.html" class="btn-secondary" id="authBtn">Login</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="admin-page">
        <div class="container">
            <h1>⚙️ Admin Control Panel</h1>
            <p style="color: var(--text-light); margin-bottom: 32px;">Welcome back, Administrator.</p>

            <div class="admin-stats-grid" id="statsGrid">
                <div class="stat-card visitors"><h3 id="statVisitors">...</h3><p>Total Visitors</p></div>
                <div class="stat-card today"><h3 id="statTodayRegs">...</h3><p>Registered Today</p></div>
                <div class="stat-card workers"><h3 id="statWorkers">...</h3><p>Workers Registered</p></div>
                <div class="stat-card clients"><h3 id="statClients">...</h3><p>Employers / Clients</p></div>
                <div class="stat-card jobs"><h3 id="statJobs">...</h3><p>Total Job Posts</p></div>
                <div class="stat-card disputes"><h3 id="statDisputes">...</h3><p>Open Disputes</p></div>
            </div>

            <div class="admin-section">
                <h2>📢 Send Message / Broadcast</h2>
                <div class="broadcast-box">
                    <label><strong>Send to:</strong></label>
                    <select id="broadcastAudience" style="margin-left:8px; padding:8px;">
