    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();

            // Allow admin if DB flag is true OR email matches ADMIN_EMAIL in config
            const adminEmail = (window.HANDYMAN_CONFIG && window.HANDYMAN_CONFIG.ADMIN_EMAIL) || '';
            const emailOk = currentUser && adminEmail &&
                currentUser.email &&
                currentUser.email.toLowerCase() === adminEmail.toLowerCase();

            if (!isAdmin() && !emailOk) {
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 100px 20px;">
                        <h1>⛔ Access Denied</h1>
                        <p style="color: var(--text-light); margin: 16px 0;">You do not have permission to view this page.</p>
                        <p style="color: var(--text-light); font-size: 0.9rem;">Logged in as: ${currentUser ? currentUser.email : 'not logged in'}</p>
                        <a href="index.html" class="btn-primary">Go Home</a>
                    </div>
                `;
                return;
            }

            loadStats();
            loadAllUsers();
            loadDisputes();
            loadAllWorkers();
            loadAllJobs();
        });

        function formatPhone(phone) {
            if (!phone) return null;
            let p = phone.toString().replace(/\D/g, '');
            if (p.startsWith('237')) p = p.substring(3);
            if (p.length === 9) return '237' + p;
            return p;
        }

        function whatsappLink(phone, message = '') {
            const p = formatPhone(phone);
            if (!p) return '#';
            const text = encodeURIComponent(message || 'Hello from Handy Man Buea Admin');
            return `https://wa.me/${p}?text=${text}`;
        }

        function callLink(phone) {
            const p = formatPhone(phone);
            return p ? `tel:+${p}` : '#';
        }

        async function loadStats() {
            if (!supabaseClient) return;
            try {
                const { data: stats } = await supabaseClient
                    .from('site_stats').select('total_visitors').eq('id', 1).single();
                document.getElementById('statVisitors').textContent = (stats && stats.total_visitors) || 0;

                const todayStart = new Date();
                todayStart.setHours(0, 0, 0, 0);
                const { count: todayCount } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .gte('created_at', todayStart.toISOString());
                document.getElementById('statTodayRegs').textContent = todayCount || 0;

                const { count: workerCount } = await supabaseClient
                    .from('profiles').select('*', { count: 'exact', head: true }).eq('is_worker', true);
                document.getElementById('statWorkers').textContent = workerCount || 0;

                const { count: clientCount } = await supabaseClient
                    .from('profiles').select('*', { count: 'exact', head: true }).eq('is_worker', false);
                document.getElementById('statClients').textContent = clientCount || 0;

                const { count: jobCount } = await supabaseClient
                    .from('job_posts').select('*', { count: 'exact', head: true });
                document.getElementById('statJobs').textContent = jobCount || 0;

                const { count: disputeCount } = await supabaseClient
                    .from('disputes').select('*', { count: 'exact', head: true }).eq('status', 'Open');
                document.getElementById('statDisputes').textContent = disputeCount || 0;
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        async function loadAllUsers() {
            const container = document.getElementById('allUsersList');
            if (!supabaseClient) {
                container.innerHTML = '<p class="empty-dashboard">Cannot connect.</p>';
                return;
            }

            const filter = document.getElementById('userFilter')?.value || 'all';
            const search = (document.getElementById('userSearch')?.value || '').toLowerCase().trim();

            try {
                let query = supabaseClient
                    .from('profiles')
                    .select('id, full_name, phone, is_worker, is_admin, location, created_at')
                    .order('created_at', { ascending: false })
                    .limit(200);

                if (filter === 'workers') query = query.eq('is_worker', true);
                if (filter === 'clients') query = query.eq('is_worker', false);

                const { data: users, error } = await query;
                if (error) {
                    container.innerHTML = '<p class="empty-dashboard">Error loading users: ' + error.message + '</p>';
                    return;
                }

                let list = users || [];
                if (search) {
                    list = list.filter(u =>
                        (u.full_name || '').toLowerCase().includes(search) ||
                        (u.phone || '').includes(search)
                    );
                }

                if (list.length === 0) {
                    container.innerHTML = '<p class="empty-dashboard">No users found.</p>';
                    return;
                }

                container.innerHTML = list.map(u => {
                    const type = u.is_admin ? '👑 Admin' : (u.is_worker ? '👷 Worker' : '👤 Client');
                    const phone = u.phone || '';
                    const safeName = (u.full_name || 'User').replace(/'/g, "\\'");
                    return `
                        <div class="user-row">
                            <div>
                                <h4 style="margin:0 0 4px;">${u.full_name || 'No name'}</h4>
                                <p style="margin:0; font-size:0.9rem;">
                                    ${type} • 📍 ${u.location || 'Buea'} • 📞 ${phone || 'No phone'}
                                </p>
                            </div>
                            <div class="user-actions">
                                ${phone ? `
                                    <a class="btn-call" href="${callLink(phone)}">📞 Call</a>
                                    <a class="btn-whatsapp" href="${whatsappLink(phone)}" target="_blank">💬 WhatsApp</a>
                                ` : ''}
                                <button class="btn-small" onclick="sendSingleNotification('${u.id}', '${safeName}')">🔔 Notify</button>
                                <button class="btn-close-job" onclick="deleteUser('${u.id}', '${safeName}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="empty-dashboard">Error loading users.</p>';
            }
        }

        async function sendSingleNotification(userId, userName) {
            const message = prompt('Write a message for ' + userName + ':');
            if (!message || !message.trim()) return;
            try {
                const { error } = await supabaseClient.from('notifications').insert([{
                    user_id: userId,
                    title: 'Message from Admin',
                    message: message.trim(),
                    read: false
                }]);
                if (error) { alert('Error: ' + error.message); return; }
                alert('Notification sent to ' + userName);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteUser(userId, name) {
            if (!confirm('Delete ' + name + '? This cannot be undone.')) return;
            try {
                await supabaseClient.from('worker_details').delete().eq('id', userId);
                await supabaseClient.from('reviews').delete().eq('worker_id', userId);
                await supabaseClient.from('job_posts').delete().eq('client_id', userId);
                await supabaseClient.from('notifications').delete().eq('user_id', userId);
                const { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
                if (error) { alert('Error: ' + error.message); return; }
                alert(name + ' deleted.');
                loadAllUsers();
                loadAllWorkers();
                loadStats();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function sendBroadcast() {
            const audience = document.getElementById('broadcastAudience').value;
            const message = document.getElementById('broadcastMessage').value.trim();
            const status = document.getElementById('broadcastStatus');

            if (!message) {
                status.textContent = 'Please type a message first.';
                status.className = 'message error';
                return;
            }

            status.textContent = 'Sending...';
            status.className = 'message';

            try {
                let query = supabaseClient.from('profiles').select('id');
                if (audience === 'workers') query = query.eq('is_worker', true);
                if (audience === 'clients') query = query.eq('is_worker', false);

                const { data: users, error } = await query;
                if (error || !users || users.length === 0) {
                    status.textContent = 'No users found for this group.';
                    status.className = 'message error';
                    return;
                }

                const rows = users.map(u => ({
                    user_id: u.id,
                    title: 'Message from Admin',
                    message: message,
                    read: false
                }));

                const { error: insertError } = await supabaseClient.from('notifications').insert(rows);
                if (insertError) {
                    status.textContent = 'Error: ' + insertError.message;
                    status.className = 'message error';
                    return;
                }

                status.textContent = 'Message sent to ' + users.length + ' user(s)!';
                status.className = 'message success';
                document.getElementById('broadcastMessage').value = '';
            } catch (err) {
                status.textContent = 'Unexpected error: ' + err.message;
                status.className = 'message error';
            }
        }

        async function submitBugReport() {
            const title = document.getElementById('bugTitle').value.trim();
            const details = document.getElementById('bugDetails').value.trim();
            const status = document.getElementById('bugStatus');

            if (!title) {
                status.textContent = 'Please enter a title.';
                status.className = 'message error';
                return;
            }

            try {
                const { error } = await supabaseClient.from('disputes').insert([{
                    reason: 'Bug/Case: ' + title,
                    details: details || 'No details',
                    target_name: 'Internal',
                    target_type: 'Bug',
                    reporter_name: (currentProfile && currentProfile.full_name) || (currentUser && currentUser.email) || 'Admin',
                    status: 'Open'
                }]);

                if (error) {
                    status.textContent = 'Error: ' + error.message;
                    status.className = 'message error';
                    return;
                }

                status.textContent = 'Bug/Case saved successfully!';
                status.className = 'message success';
                document.getElementById('bugTitle').value = '';
                document.getElementById('bugDetails').value = '';
                loadDisputes();
                loadStats();
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                status.className = 'message error';
            }
        }

        async function loadDisputes() {
            const container = document.getElementById('disputesList');
            if (!supabaseClient) {
                container.innerHTML = '<p class="empty-dashboard">Cannot connect.</p>';
                return;
            }
            try {
                const { data: disputes, error } = await supabaseClient
                    .from('disputes').select('*').order('created_at', { ascending: false });

                if (error || !disputes || disputes.length === 0) {
                    container.innerHTML = '<p class="empty-dashboard">No disputes reported yet.</p>';
                    return;
                }

                container.innerHTML = disputes.map(d => {
                    const date = new Date(d.created_at).toLocaleDateString('en-GB');
                    const statusClass = d.status === 'Open' ? 'status-open-dispute' : 'status-resolved';
                    return `
                        <div class="dispute-row">
                            <div class="dispute-info">
                                <h4>${d.reason}</h4>
                                <p><strong>Target:</strong> ${d.target_name} (${d.target_type})</p>
                                <p><strong>Reporter:</strong> ${d.reporter_name || 'Anonymous'}</p>
                                <p><strong>Details:</strong> ${d.details || 'No details'}</p>
                                <p style="font-size: 0.8rem; color: var(--text-light);">${date}</p>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
                                <span class="dispute-status ${statusClass}">${d.status}</span>
                                ${d.status === 'Open' ? `<button class="btn-small" onclick="resolveDispute('${d.id}')">Resolve</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="empty-dashboard">Error loading disputes.</p>';
            }
        }

        async function resolveDispute(disputeId) {
            if (!confirm('Mark this dispute as resolved?')) return;
            const { error } = await supabaseClient.from('disputes').update({ status: 'Resolved' }).eq('id', disputeId);
            if (error) { alert('Error: ' + error.message); return; }
            alert('Dispute resolved.');
            loadDisputes();
            loadStats();
        }

        async function loadAllWorkers() {
            const container = document.getElementById('allWorkersList');
            if (!supabaseClient) {
                container.innerHTML = '<p class="empty-dashboard">Cannot connect.</p>';
                return;
            }
            try {
                const { data: workers, error } = await supabaseClient
                    .from('worker_details')
                    .select('*, profiles(full_name, phone, location)')
                    .order('created_at', { ascending: false });

                if (error || !workers || workers.length === 0) {
                    container.innerHTML = '<p class="empty-dashboard">No workers registered yet.</p>';
                    return;
                }

                container.innerHTML = workers.map(w => {
                    const p = w.profiles || {};
                    const safeName = (p.full_name || 'this worker').replace(/'/g, "\\'");
                    return `
                        <div class="dispute-row">
                            <div class="dispute-info">
                                <h4>${p.full_name || 'Unknown'}</h4>
                                <p>${w.category} • ${p.phone || 'No phone'} • ${p.location || 'Buea'}</p>
                                <p style="font-size: 0.8rem; color: var(--text-light);">${w.rating || 0}/5 • ${w.review_count || 0} reviews</p>
                            </div>
                            <button class="btn-close-job" onclick="deleteWorker('${w.id}', '${safeName}')">Delete</button>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="empty-dashboard">Error loading workers.</p>';
            }
        }

        async function deleteWorker(workerId, name) {
            if (!confirm('Delete ' + name + '? This cannot be undone.')) return;
            await supabaseClient.from('worker_details').delete().eq('id', workerId);
            await supabaseClient.from('reviews').delete().eq('worker_id', workerId);
            await supabaseClient.from('profiles').delete().eq('id', workerId);
            alert(name + ' has been deleted.');
            loadAllWorkers();
            loadAllUsers();
            loadStats();
        }

        async function loadAllJobs() {
            const container = document.getElementById('allJobsList');
            if (!supabaseClient) {
                container.innerHTML = '<p class="empty-dashboard">Cannot connect.</p>';
                return;
            }
            try {
                const { data: jobs, error } = await supabaseClient
                    .from('job_posts')
                    .select('*, profiles(full_name)')
                    .order('created_at', { ascending: false });

                if (error || !jobs || jobs.length === 0) {
                    container.innerHTML = '<p class="empty-dashboard">No jobs posted yet.</p>';
                    return;
                }

                container.innerHTML = jobs.map(job => {
                    const date = new Date(job.created_at).toLocaleDateString('en-GB');
                    const statusClass = job.status === 'Open' ? 'status-available' : 'status-closed';
                    return `
                        <div class="dispute-row">
                            <div class="dispute-info">
                                <h4>${job.title}</h4>
                                <p>${job.category} • ${job.location} • by ${(job.profiles && job.profiles.full_name) || 'Unknown'} • ${date}</p>
                                <span class="status-badge ${statusClass}">${job.status}</span>
                            </div>
                            <button class="btn-close-job" onclick="deleteJob('${job.id}')">Delete</button>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p class="empty-dashboard">Error loading jobs.</p>';
            }
        }

        async function deleteJob(jobId) {
            if (!confirm('Delete this job?')) return;
            const { error } = await supabaseClient.from('job_posts').delete().eq('id', jobId);
            if (error) { alert('Error: ' + error.message); return; }
            alert('Job deleted.');
            loadAllJobs();
            loadStats();
        }
    </script>
</body>
</html>
