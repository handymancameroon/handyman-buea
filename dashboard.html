<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - HandyMan Cameroon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<nav class="navbar"><a href="index.html">🔧 HandyMan</a><a href="workers.html">Find Workers</a><a href="jobs.html">Jobs</a><button onclick="logout()" class="btn-small">Logout</button></nav>

<div class="container">
<h1>My Profile / Mon Profil</h1>

<div style="background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;margin:16px 0;">
<h3>Profile Photo</h3>
<img id="profilePhoto" src="https://via.placeholder.com/120" style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
<input type="file" id="photoFile" accept="image/*">
<button onclick="updatePhoto()" class="btn-small">Upload Photo</button>
<p>Photo uploads to your profile and shows in search - fixed</p>
</div>

<div style="background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;">
<h3>Edit Profile</h3>
<input type="text" id="fullName" placeholder="Full Name" style="width:100%;padding:10px;margin:6px 0;">
<input type="text" id="phone" placeholder="Phone" style="width:100%;padding:10px;margin:6px 0;">
<input type="text" id="whatsapp" placeholder="WhatsApp" style="width:100%;padding:10px;margin:6px 0;">
<select id="town" style="width:100%;padding:10px;margin:6px 0;"></select>
<select id="category" style="width:100%;padding:10px;margin:6px 0;"></select>
<textarea id="bio" placeholder="Bio / Skills" style="width:100%;padding:10px;margin:6px 0;"></textarea>
<button onclick="saveProfile()" class="btn">Save Profile</button>
<p id="saveStatus"></p>
</div>

<div style="background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;margin:16px 0;">
<h3>My Jobs by Category</h3><div id="myJobs"></div>
</div>

<div style="background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;">
<h3>My Disputes / Reports</h3><div id="myReports"></div>
</div>

<div style="background:white;padding:20px;border-radius:12px;border:1px solid #e2e8f0;margin:16px 0;">
<h3>My Reviews Received - Count Fixed</h3><div id="myReviews"></div>
</div>

</div>

<script src="app.js"></script>
<script>
let currentUserId = null;
async function loadDashboard(){
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user){ location.href='login.html'; return; }
  currentUserId=user.id;
  const {data:profile} = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
  if(!profile) return;
  document.getElementById('fullName').value=profile.full_name||'';
  document.getElementById('phone').value=profile.phone||'';
  document.getElementById('whatsapp').value=profile.whatsapp||'';
  document.getElementById('bio').value=profile.bio||'';
  if(profile.photo_url||profile.avatar_url){ document.getElementById('profilePhoto').src=profile.photo_url||profile.avatar_url; }
  // Towns
  const townSel=document.getElementById('town'); townSel.innerHTML=''; CAMEROON_TOWNS.forEach(t=>{ const opt=document.createElement('option'); opt.value=t; opt.text=t; if(profile.town===t) opt.selected=true; townSel.appendChild(opt); });
  const catSel=document.getElementById('category'); catSel.innerHTML=''; CATEGORIES.forEach(c=>{ const opt=document.createElement('option'); opt.value=c; opt.text=c; if(profile.category===c) opt.selected=true; catSel.appendChild(opt); });

  // Jobs by category
  const {data: jobs} = await supabaseClient.from('jobs').select('*').eq('user_id', user.id).order('created_at',{ascending:false});
  document.getElementById('myJobs').innerHTML=(jobs||[]).map(j=>`<div style="padding:8px;border-bottom:1px solid #eee;"><b>${j.title}</b> - ${j.category||''} - ${j.town||''} - ${j.status||'open'} <button onclick="deleteMyJob('${j.id}')">Delete</button></div>`).join('') || 'No jobs posted';

  // Reports
  const {data: reports} = await supabaseClient.from('reports').select('*, reported:profiles!reports_reported_id_fkey(full_name)').eq('reporter_id', user.id);
  document.getElementById('myReports').innerHTML=(reports||[]).map(r=>`<div>${r.reason} vs ${r.reported?.full_name||r.reported_id} - ${r.status||'pending'}</div>`).join('') || 'No disputes';

  // Reviews - show fixed count
  const {data: reviews} = await supabaseClient.from('reviews').select('*').eq('worker_id', user.id);
  document.getElementById('myReviews').innerHTML=(reviews||[]).map(r=>`<div>⭐${r.rating} - ${r.comment||''} by ${r.reviewer_name||'Anon'} ${r.photo_url?`<a href="${r.photo_url}" target="_blank">Photo</a>`:''}</div>`).join('') + `<p><b>Total: ${profile.total_reviews||reviews.length} reviews, Avg: ${profile.average_rating? Number(profile.average_rating).toFixed(1):'0.0'}</b> - Fixed</p>`;
}
loadDashboard();

async function updatePhoto(){
  const file=document.getElementById('photoFile').files[0]; if(!file){ alert('Select photo'); return; }
  const url = await uploadFile(file, 'avatars', currentUserId);
  if(!url){ alert('Upload failed'); return; }
  await supabaseClient.from('profiles').update({photo_url:url, avatar_url:url}).eq('id', currentUserId);
  document.getElementById('profilePhoto').src=url; alert('Photo updated!');
}
async function saveProfile(){
  const updates={ full_name:document.getElementById('fullName').value, phone:document.getElementById('phone').value, whatsapp:document.getElementById('whatsapp').value, town:document.getElementById('town').value, category:document.getElementById('category').value, bio:document.getElementById('bio').value, is_worker:true };
  const {error}=await supabaseClient.from('profiles').update(updates).eq('id', currentUserId);
  if(error){ document.getElementById('saveStatus').innerText='Error: '+error.message; } else { document.getElementById('saveStatus').innerText='Saved! / Sauvegardé!'; }
}
async function deleteMyJob(id){ if(!confirm('Delete job?')) return; await supabaseClient.from('jobs').delete().eq('id',id); loadDashboard(); }
async function logout(){ await supabaseClient.auth.signOut(); location.href='index.html'; }
</script>
</body>
</html>
